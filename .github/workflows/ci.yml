name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 后端测试: 三平台 × 多版本矩阵 (含三个 submodule)。测试不依赖真实
  # 数据库 —— conftest 给每个用例注入独立的 SQLite 文件库, TestClient
  # 不触发 lifespan, 永不触碰 docker/PostgreSQL (NAS 之外的环境可跑)。
  # 子仓的深度测试在它们自己的仓里跑, 这里只验组合装配那一层。
  python-tests:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, windows-latest, windows-2022,
             macos-latest, macos-14]
        python-version: ["3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # 不带 --cov: 与本地 run_tests.sh 对齐 (覆盖率门槛配置保留给手动验证)
      - run: python -m pytest tests -q

  # 后端静态检查: pylint (app 严检 / tests 放宽仪式告警) + mypy 严格。
  # 只查本仓的 app/tests —— 子仓以合成包名动态装载, 不进静态图。
  python-lint:
    name: pylint + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pylint app
      - run: python -m pylint tests --disable=W0613,W0212,R0801,C0415
      - run: python -m mypy

  # 前端: ESLint / stylelint / html-validate —— 只管共享层
  # (app/home/static; 三个应用的前端门禁在各自仓的 CI 里)。
  frontend:
    name: frontend (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx --no-install eslint app/home/static
      - run: npx --no-install stylelint "app/home/static/css/*.css"
      - run: npx --no-install html-validate "app/home/static/*.html"
