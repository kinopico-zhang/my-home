<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="/tesla/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/tesla/static/favicon.svg">
<link rel="apple-touch-icon" href="/tesla/static/apple-touch-icon.png?v=2">
<link rel="manifest" href="/tesla/static/manifest.json">
<title>当前驾驶 · My Tesla</title>
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --surface: #1c1c1e;
  --surface-2: #2c2c2e;
  --ink-1: #f5f5f7;
  --ink-2: rgba(235,235,245,.62);
  --ink-3: rgba(235,235,245,.32);
  --hairline: rgba(255,255,255,.09);
  --nav-bg: rgba(10,10,12,.72);
  --blue: #3987e5;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink-1);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
               "Helvetica Neue", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45;
  height: 100vh; height: 100dvh;
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ---------- 顶部导航 (毛玻璃, 与其他页一致) ---------- */
header {
  padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background: var(--nav-bg);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--hairline);
  z-index: 50;
}
.nav-row { display: flex; align-items: baseline; gap: 8px; }
.nav-row > * { flex-shrink: 0; }
.nav-menu { position: relative; align-self: center; margin-left: auto; }
.nav-menu summary {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: var(--ink-1); background: var(--surface-2);
  padding: 4px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  list-style: none; -webkit-user-select: none; user-select: none;
}
.nav-menu summary::-webkit-details-marker { display: none; }
.nav-menu summary:active { opacity: .7; }
.nav-menu[open] summary { background: var(--surface-3); }
.nav-menu .chev { transition: transform .18s; }
.nav-menu[open] .chev { transform: rotate(180deg); }
.nav-menu .menu {
  position: absolute; top: calc(100% + 8px); right: 0; min-width: 128px; z-index: 30;
  display: flex; flex-direction: column; padding: 5px;
  background: rgba(44,44,46,.88);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--hairline); border-radius: 14px;
  box-shadow: 0 12px 32px rgba(0,0,0,.5);
}
.nav-menu .menu a {
  font-size: 14px; color: var(--ink-1); text-decoration: none;
  padding: 9px 12px; border-radius: 10px; white-space: nowrap;
}
.nav-menu .menu a:active { background: var(--surface-3); }
.nav-menu .menu a.on { color: #7db3f0; }
.brand-menu { margin-left: 0; }
.brand-menu summary {
  font-size: 20px; font-weight: 700; letter-spacing: -.3px;
  background: none; padding: 0; border-radius: 0;
}
.brand-menu[open] summary { background: none; }
.brand-menu .chev { color: var(--ink-3); }
.brand-menu .menu { left: 0; right: auto; }
.nav-menu .menu .logout-row {
  color: #e5484d; border-top: 1px solid var(--hairline); margin-top: 5px;
}
.brand-menu + .nav-menu { margin-left: auto; }
.nav-menu .menu button {
  font-size: 14px; color: var(--ink-1); text-align: left;
  padding: 9px 12px; border-radius: 10px; white-space: nowrap;
}
.nav-menu .menu button:active { background: var(--surface-3); }
/* 手机: 下拉改顶栏正下方近全宽面板 (同其他页) */
@media (max-width: 479px) {
  header { position: relative; }
  .nav-menu { position: static; }
  .nav-menu .menu { left: 12px; right: 12px; }
}

/* ---------- 主体 ---------- */
main {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  padding: 10px 14px calc(env(safe-area-inset-bottom) + 10px); gap: 10px;
  overflow: hidden;
}

/* 首帧等待 (第一次状态返回前) */
.booting { flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 14px; color: var(--ink-2); }
.spin {
  width: 30px; height: 30px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,.18); border-top-color: var(--blue);
  animation: rot .8s linear infinite;
}
@keyframes rot { to { transform: rotate(360deg); } }

/* ---------- 驾驶视图 ---------- */
#live { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }

.hero {
  background: var(--surface); border: 1px solid var(--hairline); border-radius: 18px;
  padding: 14px 18px; display: flex; align-items: center; gap: 16px;
}
.hero-speed { flex: 1; min-width: 0; }
.hero-speed .lb { font-size: 12px; color: var(--ink-2); }
.hero-speed .num {
  font-size: 54px; font-weight: 700; letter-spacing: -2px; line-height: 1.05;
  font-variant-numeric: tabular-nums; margin-top: 2px;
}
.hero-speed .num small { font-size: 15px; font-weight: 500; color: var(--ink-2);
  letter-spacing: 0; margin-left: 4px; }
.hero-side { flex-shrink: 0; text-align: right; display: grid; gap: 4px; }
.hero-side .lb { font-size: 11px; color: var(--ink-2); }
.hero-side .elapsed { font-size: 24px; font-weight: 650; letter-spacing: -.5px;
  font-variant-numeric: tabular-nums; }
.hero-side .sub { font-size: 12px; color: var(--ink-2);
  font-variant-numeric: tabular-nums; }

.batt-card {
  background: var(--surface); border: 1px solid var(--hairline); border-radius: 18px;
  padding: 11px 16px; display: flex; align-items: center; gap: 12px;
}
.batt { position: relative; width: 46px; height: 22px; flex: none;
  border: 1.5px solid var(--ink-3); border-radius: 6px; padding: 2px; }
.batt::after {   /* 电池正极凸点 */
  content: ""; position: absolute; right: -5px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 9px; background: var(--ink-3); border-radius: 0 2px 2px 0;
}
.batt i { display: block; height: 100%; border-radius: 3px; background: #32d74b;
  transition: width .5s, background .5s; }
.batt-card b { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
.batt-card .batt-range { font-size: 13px; color: var(--ink-2); }
.batt-card .batt-range b { font-size: 13px; color: var(--ink-1); font-weight: 600; }

.tiles { display: flex; gap: 10px; }
.tile {
  flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 14px; padding: 9px 8px; text-align: center;
}
.tile .lb { font-size: 11px; color: var(--ink-2); white-space: nowrap; }
.tile .val { font-size: 17px; font-weight: 650; letter-spacing: -.3px; margin-top: 2px;
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile .val small { font-size: 10.5px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }

.map-wrap {
  position: relative; flex: 1; min-height: 0;
  border-radius: 16px; overflow: hidden; border: 1px solid var(--hairline);
  background: var(--surface);
}
#map { position: absolute; inset: 0; touch-action: none; }
.map-fallback {   /* 高德不可用: 统计照常, 只在地图位放提示 */
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  color: var(--ink-2); font-size: 13px; padding: 20px; text-align: center;
}
.stale-hint {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 30;
  padding: 6px 14px; border-radius: 999px;
  background: rgba(28,28,30,.85);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--hairline);
  font-size: 12px; color: var(--ink-2); white-space: nowrap;
  pointer-events: none;
}
/* 车辆位置: 蓝点 + 扩散脉冲 (在开的人一眼看到自己在哪) */
.car-dot { position: relative; width: 18px; height: 18px; }
.car-dot::before {
  content: ""; position: absolute; inset: -8px; border-radius: 50%;
  background: rgba(57,135,229,.4); animation: pulse 1.8s ease-out infinite;
}
.car-dot::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: #3987e5; border: 2.5px solid #fff;
  box-shadow: 0 1px 5px rgba(0,0,0,.55);
}
@keyframes pulse { 0% { transform: scale(.55); opacity: .9; }
                   100% { transform: scale(2.3); opacity: 0; } }

/* ---------- 空态 / 结束态 ---------- */
.state-view { flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 6px; padding: 24px; text-align: center; }
.state-view .big { font-size: 44px; line-height: 1.2; }
.state-view h2 { font-size: 18px; font-weight: 700; }
.state-view p { font-size: 13px; color: var(--ink-2); max-width: 300px; }
.state-view .cta {
  margin-top: 14px; padding: 10px 28px; border-radius: 999px;
  background: var(--blue); color: #fff; font-size: 14px; font-weight: 600;
  text-decoration: none; display: inline-block;
}
.state-view .cta:active { opacity: .8; }
</style>
</head>
<body>
<header>
  <div class="nav-row">
    <details class="nav-menu brand-menu" id="brand-menu">
      <summary>My Tesla<svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="menu">
        <a href="/tesla/charging">充电</a>
        <a href="/tesla/map">足迹</a>
        <a href="/tesla/trips">行程</a>
        <a class="on" href="/tesla/live">当前驾驶</a>
        <a href="/tesla/settings">设置</a>
        <button class="logout-row" id="logout" title="退出登录">退出登录</button>
      </div>
    </details>
  </div>
</header>

<main>
  <div class="booting" id="booting">
    <div class="spin"></div>
    <div>正在获取车辆状态…</div>
  </div>

  <!-- 驾驶中 -->
  <section id="live" hidden>
    <div class="hero">
      <div class="hero-speed">
        <div class="lb">当前车速</div>
        <div class="num"><span id="lv-speed">–</span><small>km/h</small></div>
      </div>
      <div class="hero-side">
        <div class="lb">已行驶</div>
        <div class="elapsed" id="lv-elapsed">–</div>
        <div class="sub" id="lv-sub">–</div>
      </div>
    </div>
    <div class="batt-card">
      <span class="batt"><i id="batt-fill" style="width:0%"></i></span>
      <b id="lv-soc">–%</b>
      <span class="batt-range">额定续航 <b id="lv-range">–</b> km</span>
    </div>
    <div class="tiles">
      <div class="tile"><div class="lb">里程</div><div class="val" id="lv-km">–</div></div>
      <div class="tile"><div class="lb">已耗电</div><div class="val" id="lv-kwh">–</div></div>
      <div class="tile"><div class="lb">平均电耗</div><div class="val" id="lv-avg">–</div></div>
      <div class="tile"><div class="lb">最高车速</div><div class="val" id="lv-vmax">–</div></div>
    </div>
    <div class="map-wrap">
      <div id="map"></div>
      <div class="stale-hint" id="stale-hint" hidden></div>
      <div class="map-fallback" id="map-fallback" hidden>
        <div>🗺️</div>
        <div id="map-fallback-text">地图暂不可用 (未配置高德 Key 或加载失败),<br>速度与电量数据不受影响</div>
      </div>
    </div>
  </section>

  <!-- 刚结束 (上一次状态还在开车, 现在结束了) -->
  <section id="ended" hidden>
    <div class="state-view">
      <div class="big">✅</div>
      <h2>本次驾驶已结束</h2>
      <p>行程已记录, 继续出发时这里会自动恢复实时显示</p>
      <a class="cta" id="ended-link" href="/tesla/trips">查看本次行程</a>
    </div>
  </section>

  <!-- 没在开车 -->
  <section id="idle" hidden>
    <div class="state-view">
      <div class="big">🚗</div>
      <h2>当前没有进行中的驾驶</h2>
      <p>车辆出发后, 这里会实时显示车速、位置轨迹、电耗与剩余电量</p>
    </div>
  </section>
</main>

<script src="/tesla/static/gcj02.js?v=1"></script>
<script>
"use strict";
/* 点空白处收起页签菜单 */
document.addEventListener("click", e => {
  const t = e.target;
  if (!(t instanceof Element) || !t.isConnected) return;
  const inside = t.closest("details.nav-menu");
  document.querySelectorAll("details.nav-menu[open]").forEach(m => {
    if (m !== inside) m.removeAttribute("open");
  });
});
const $ = s => document.querySelector(s);
const PAGE_V = "v1";

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (r.status === 401) { location.replace("/tesla/login"); throw new Error("未登录"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || ("HTTP " + r.status));
  return r.json();
}

/* ---------- 状态机: booting → live / idle, live → ended (行程闭合) ---------- */
const POLL_MS = 5000, TRACK_MS = 20000, STALE_AFTER_S = 120;
let cur = null;            // 最近一次 status (driving=true)
let driveId = null;        // 当前在渲染的行程 id
let pollTimer = null, trackTimer = null;
let map = null, mapFailed = false, carMarker = null, routeLine = null;

function showState(id) {
  for (const el of ["booting", "live", "ended", "idle"]) $("#" + el).hidden = el !== id;
}

const pad = n => String(n).padStart(2, "0");
function fmtElapsed(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? h + ":" + pad(m) + ":" + pad(s) : m + ":" + pad(s);
}
function setVal(sel, val, unit) {   // 数值 + 单位 (null → "–")
  $(sel).innerHTML = val == null ? "–"
    : (unit ? val + "<small>" + unit + "</small>" : val);
}

function render(s) {
  $("#lv-speed").textContent = s.speed == null ? "–" : Math.round(s.speed);
  $("#lv-sub").textContent =
    "出发 " + (s.start ? s.start.slice(11) : "–") +
    " · 最高 " + (s.speed_max == null ? "–" : Math.round(s.speed_max)) + " km/h";
  if (s.soc != null) {
    $("#lv-soc").textContent = s.soc + "%";
    const fill = $("#batt-fill");
    fill.style.width = s.soc + "%";
    fill.style.background = s.soc > 50 ? "#32d74b" : s.soc > 20 ? "#ffd60a" : "#ff453a";
  } else {
    $("#lv-soc").textContent = "–";
  }
  $("#lv-range").textContent = s.rated_range_km == null ? "–" : Math.round(s.rated_range_km);
  setVal("#lv-km", s.km == null ? null : s.km.toFixed(1), "km");
  setVal("#lv-kwh", s.kwh == null ? null : s.kwh.toFixed(1), "kWh");
  setVal("#lv-avg", s.wh_per_km == null ? null : s.wh_per_km, "Wh/km");
  setVal("#lv-vmax", s.speed_max == null ? null : Math.round(s.speed_max), "km/h");
  renderElapsed(s);
  renderStale(s);
  if (map && s.lng != null) setCar(s.lng, s.lat);
}

function renderElapsed(s) {
  const sec = Math.max(0, Math.floor(Date.now() / 1000 - s.started_utc));
  $("#lv-elapsed").textContent = fmtElapsed(sec);
}

function renderStale(s) {   // 最新位置点太久没更新 → 提示信号中断 (隧道/无网)
  const hint = $("#stale-hint");
  const age = s.pos_utc ? Math.floor(Date.now() / 1000 - s.pos_utc) : 0;
  if (age > STALE_AFTER_S) {
    hint.hidden = false;
    hint.textContent = "信号可能中断 · 数据 " + Math.floor(age / 60) + " 分钟前更新";
  } else {
    hint.hidden = true;
  }
}

function setCar(lng, lat) {   // 车辆蓝点 (跟随: 每次刷新把车拉回视野中心)
  const p = GCJ02.wgs84ToGcj02(lng, lat);
  if (carMarker) carMarker.setPosition(p);
  else {
    carMarker = new AMap.Marker({ position: p, zIndex: 120, offset: new AMap.Pixel(-9, -9),
      content: '<div class="car-dot"></div>' });
    map.add(carMarker);
  }
  map.setCenter(p);
}

async function refreshTrack() {
  if (!map || !driveId) return;
  try {
    const t = await getJSON("/tesla/trips/api/" + driveId + "/track");
    if (!map || t.id !== driveId) return;   // 行程已切换, 迟到的响应作废
    const path = t.pts.map(p => GCJ02.wgs84ToGcj02(p[0], p[1]));
    if (routeLine) map.remove(routeLine);
    routeLine = new AMap.Polyline({ path, strokeColor: "#3987e5", strokeWeight: 5,
      strokeOpacity: 1, lineJoin: "round", lineCap: "round", zIndex: 90, showDir: true });
    map.add(routeLine);
  } catch (e) { /* 刚出发位置点不足 2 个会 404, 下轮再取 */ }
}

function enterDriving(s) {
  driveId = s.drive_id;
  if (map && routeLine) { map.remove(routeLine); routeLine = null; }
  showState("live");
  refreshTrack();
  clearInterval(trackTimer);
  trackTimer = setInterval(refreshTrack, TRACK_MS);
}

async function poll() {
  let s;
  try {
    s = await getJSON("/tesla/live/api/status");
  } catch (e) { return; }   // 轮询失败保留当前画面, 下一轮再试
  if (s.driving) {
    if (!cur || !cur.driving || cur.drive_id !== s.drive_id) enterDriving(s);
    cur = s;
    render(s);
  } else if (cur && cur.driving) {   // 开着开着结束了: 给"已结束"态 + 行程深链
    const doneId = cur.drive_id;
    clearInterval(trackTimer);
    if (doneId != null) $("#ended-link").href = "/tesla/trips?id=" + doneId;
    cur = null;
    showState("ended");
  } else {
    cur = null;
    showState("idle");
  }
}

/* ---------- 地图尽力而为: 失败不挡统计, 只占位提示 ---------- */
async function initMap() {
  try {
    const cfg = await getJSON("/tesla/map/api/config?_=" + Date.now());
    if (!cfg.amap_key) throw new Error("no key");
    if (cfg.security_code) window._AMapSecurityConfig = { securityJsCode: cfg.security_code };
    await new Promise((resolve, reject) => {
      const sc = document.createElement("script");
      sc.src = "https://webapi.amap.com/maps?v=2.0&key=" + encodeURIComponent(cfg.amap_key);
      sc.onload = resolve;
      sc.onerror = () => reject(new Error("script"));
      document.head.appendChild(sc);
    });
    map = new AMap.Map("map", { mapStyle: "amap://styles/dark", zoom: 16,
      center: [114.05, 22.55] });
    // iOS Safari 双指缩放劫持成整页缩放: 手势只给高德
    for (const ev of ["gesturestart", "gesturechange"])
      document.getElementById("map").addEventListener(ev, e => e.preventDefault());
    if (cur && cur.driving) {   // 地图就位前首轮渲染可能已过: 补画车点 + 轨迹
      render(cur);
      refreshTrack();
    }
  } catch (e) {
    mapFailed = true;
    $("#map-fallback").hidden = false;
  }
}

setInterval(() => { if (cur && cur.driving) renderElapsed(cur); }, 1000);
document.addEventListener("visibilitychange", () => {   // 从后台切回立即刷新
  if (!document.hidden) poll();
});
$("#logout").addEventListener("click", async () => {
  try { await fetch("/tesla/api/logout", { method: "POST" }); } catch (e) {}
  location.href = "/tesla/login";
});

initMap();
poll();
pollTimer = setInterval(poll, POLL_MS);
</script>
</body>
</html>
