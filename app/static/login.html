<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="/tesla/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/tesla/static/favicon.svg">
<link rel="apple-touch-icon" href="/tesla/static/apple-touch-icon.png?v=2">
  <title>登录 · My Tesla</title>
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --surface: #1c1c1e;
  --surface-2: #2c2c2e;
  --ink-1: #f5f5f7;
  --ink-2: rgba(235,235,245,.62);
  --ink-3: rgba(235,235,245,.32);
  --hairline: rgba(255,255,255,.09);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink-1);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
               "Helvetica Neue", system-ui, sans-serif;
  font-size: 15px; display: flex; align-items: center; justify-content: center;
  padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
}
.card {
  width: 100%; max-width: 340px;
  background: var(--surface); border-radius: 20px;
  border: 1px solid var(--hairline);
  padding: 34px 22px 26px; text-align: center;
}
.icon {
  width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 16px;
  background: linear-gradient(160deg, #3987e5, #1fa349);
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
}
h1 { font-size: 21px; font-weight: 700; letter-spacing: -.3px; }
.sub { font-size: 13px; color: var(--ink-2); margin: 5px 0 22px; }
.field {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface-2); border-radius: 12px;
  padding: 12px 14px; margin-bottom: 10px; text-align: left;
}
.field label { font-size: 13px; color: var(--ink-2); flex: none; width: 3.5em; }
.field input {
  flex: 1; min-width: 0; border: 0; outline: 0; background: none;
  color: var(--ink-1); font: inherit; caret-color: #3987e5;
}
.field input::placeholder { color: var(--ink-3); }
.eye-btn {
  flex: none; border: 0; background: none; padding: 4px 2px; margin: -4px -2px;
  color: var(--ink-3); cursor: pointer; display: flex; align-items: center;
}
.eye-btn:active { color: var(--ink-1); }
.eye-btn svg { width: 20px; height: 20px; display: block; }
.btn {
  width: 100%; padding: 13px; margin-top: 14px; border: 0; border-radius: 12px;
  background: #3987e5; color: #fff; font-size: 16px; font-weight: 600;
  cursor: pointer; transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(.98); opacity: .85; }
.btn[disabled] { opacity: .5; }
.err {
  font-size: 13px; color: #ff6961; margin-top: 12px; min-height: 18px;
}
.shake { animation: shake .35s; }
@keyframes shake {
  20% { transform: translateX(-8px); } 40% { transform: translateX(7px); }
  60% { transform: translateX(-5px); } 80% { transform: translateX(3px); }
}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="icon">⚡</div>
  <h1>My Tesla</h1>
  <div class="sub">请登录后查看</div>
  <form id="form" autocomplete="on">
    <div class="field">
      <label for="user">账号</label>
      <input id="user" name="username" type="text" autocapitalize="off"
             autocorrect="off" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="pass">密码</label>
      <input id="pass" name="password" type="password" autocomplete="current-password" required>
      <button type="button" class="eye-btn" id="eye" aria-label="显示密码">
        <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg id="eye-slash" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden>
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>
    <button class="btn" id="btn" type="submit">登 录</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
"use strict";
const form = document.getElementById("form");
const errEl = document.getElementById("err");
const btn = document.getElementById("btn");
const card = document.getElementById("card");
const passInput = document.getElementById("pass");
const eyeBtn = document.getElementById("eye");

// 查看密码: 明文 ↔ 密文, 图标同步切换
eyeBtn.addEventListener("click", () => {
  const show = passInput.type === "password";
  passInput.type = show ? "text" : "password";
  eyeBtn.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
  document.getElementById("eye-open").hidden = show;
  document.getElementById("eye-slash").hidden = !show;
});

form.addEventListener("submit", async e => {
  e.preventDefault();
  errEl.textContent = "";
  btn.disabled = true;
  try {
    const r = await fetch("/tesla/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user: document.getElementById("user").value,
        password: document.getElementById("pass").value,
      }),
    });
    if (r.ok) { location.replace("/tesla/charging"); return; }
    // 优先展示后端给出的原因 (账号密码错误 / 尝试次数过多…), 兜底按状态码
    const d = await r.json().catch(() => null);
    let msg;
    if (d && d.detail) msg = String(d.detail);
    else if (r.status === 401) msg = "账号或密码错误";
    else if (r.status === 429) msg = "尝试次数过多, 请稍后再试";
    else if (r.status === 404) msg = "登录接口不存在, 服务可能未更新";
    else msg = `登录失败 (HTTP ${r.status})`;
    errEl.textContent = msg;
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
  } catch (e) {
    errEl.textContent = "网络错误, 请重试";
  }
  btn.disabled = false;
});
document.getElementById("user").focus();
</script>
</body>
</html>
