<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>足迹地图 · My Tesla</title>
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --surface: #1c1c1e;
  --surface-2: #2c2c2e;
  --ink-1: #f5f5f7;
  --ink-2: rgba(235,235,245,.62);
  --ink-3: rgba(235,235,245,.32);
  --hairline: rgba(255,255,255,.09);
  --nav-bg: rgba(10,10,12,.72);
  --blue: #3987e5;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
/* hidden 属性必须压过任何 class 的 display 规则, 否则浮层永远显示 (弹窗根因) */
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink-1);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
               "Helvetica Neue", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45;
  height: 100vh; height: 100dvh;
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ---------- 顶部导航 (毛玻璃, 与充电页一致) ---------- */
header {
  padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background: var(--nav-bg);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--hairline);
  z-index: 50;
}
.nav-row { display: flex; align-items: baseline; gap: 10px; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
.tabs { margin-left: auto; align-self: center; display: flex; gap: 6px; }
.tabs a {
  font-size: 12px; color: var(--ink-2); padding: 4px 11px;
  border-radius: 999px; border: 1px solid var(--hairline);
  text-decoration: none; transition: all .15s;
}
.tabs a.on { color: var(--ink-1); background: var(--surface-2); }
.logout-btn {
  align-self: center; font-size: 12px; color: var(--ink-3);
  padding: 4px 11px; border-radius: 999px; border: 1px solid var(--hairline);
}
.logout-btn:active { color: var(--ink-1); }
.chips { display: flex; gap: 7px; align-items: center; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  padding: 5px 11px; border-radius: 999px; font-size: 12.5px; white-space: nowrap; flex: none;
  color: var(--ink-2); border: 1px solid var(--hairline); transition: all .18s;
}
.chip.on { background: rgba(57,135,229,.20); color: #7db3f0; border-color: rgba(57,135,229,.35); }

/* ---------- 统计行 ---------- */
.stats { display: flex; gap: 10px; padding: 10px 14px 0; }
.stat {
  flex: 1; background: var(--surface); border-radius: 14px;
  padding: 9px 13px; border: 1px solid var(--hairline);
}
.stat .lb { font-size: 11px; color: var(--ink-2); }
.stat .val { font-size: 19px; font-weight: 650; letter-spacing: -.4px; margin-top: 2px;
             font-variant-numeric: tabular-nums; }
.stat .val small { font-size: 11px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }

/* ---------- 地图 ---------- */
main { position: relative; flex: 1; min-height: 0; margin-top: 10px; }
#map { position: absolute; inset: 0; }
.overlay {
  position: absolute; inset: 0; z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 24px; background: rgba(0,0,0,.45);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.spin {
  width: 30px; height: 30px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,.18); border-top-color: var(--blue);
  animation: rot .8s linear infinite;
}
@keyframes rot { to { transform: rotate(360deg); } }
.ov-text { font-size: 14px; color: var(--ink-2); }
.retry-btn {
  padding: 9px 26px; border-radius: 999px; font-size: 14px; font-weight: 600;
  background: var(--blue); color: #fff;
}
.hint-card {
  max-width: 420px; background: var(--surface); border-radius: 18px;
  border: 1px solid var(--hairline); padding: 22px 20px; text-align: left;
}
.hint-card h2 { font-size: 17px; text-align: center; margin-bottom: 4px; }
.hint-card .h-sub { font-size: 12.5px; color: var(--ink-2); text-align: center; margin-bottom: 14px; }
.hint-card ol { padding-left: 20px; display: grid; gap: 7px; font-size: 13px; color: var(--ink-2); }
.hint-card code {
  font-family: ui-monospace, Menlo, monospace; font-size: 12px;
  background: var(--surface-2); padding: 1px 6px; border-radius: 5px; color: #7db3f0;
}
.hint-card a { color: #7db3f0; }

.spin-s { width: 14px; height: 14px; border-width: 2px; }
.refine-tip {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px);
  transform: translateX(-50%); z-index: 30;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; border-radius: 999px;
  background: rgba(28,28,30,.85);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--hairline);
  font-size: 12.5px; color: var(--ink-2); white-space: nowrap;
  max-width: calc(100% - 32px);
  pointer-events: none;   /* 纯提示, 不挡地图操作 */
}

/* ---------- 行程信息底部弹层 ---------- */
.backdrop {
  position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.4);
  opacity: 0; pointer-events: none; transition: opacity .2s;  /* 隐藏时必须放过点击, 否则挡住地图 */
}
.backdrop.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 91;
  background: var(--surface-2); border-radius: 20px 20px 0 0;
  padding: 10px 20px calc(env(safe-area-inset-bottom) + 22px);
  transform: translateY(105%); transition: transform .28s cubic-bezier(.32,.72,.33,1);
}
.sheet.show { transform: translateY(0); }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--hairline); margin: 0 auto 14px; }
.sh-title { font-size: 17px; font-weight: 700; }
.sh-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.sh-grid { display: flex; gap: 10px; margin-top: 14px; }
.sh-cell { flex: 1; background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.sh-cell .lb { font-size: 11px; color: var(--ink-2); }
.sh-cell .val { font-size: 18px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.sh-cell .val small { font-size: 11px; color: var(--ink-2); font-weight: 500; }
</style>
</head>
<body>
<header>
  <div class="nav-row">
    <h1>My Tesla</h1>
    <nav class="tabs">
      <a href="/tesla/charging">充电</a>
      <a class="on" href="/tesla/map">足迹</a>
    </nav>
    <button id="logout" class="logout-btn" title="退出登录">退出</button>
  </div>
  <div class="chips" id="chips-range">
    <button class="chip on" data-v="all">全部</button>
    <button class="chip" data-v="30d">近30天</button>
    <button class="chip" data-v="90d">近90天</button>
    <button class="chip" data-v="ytd">今年</button>
  </div>
</header>

<div class="stats" id="stats" hidden>
  <div class="stat"><div class="lb">行程</div><div class="val" id="st-drives">–</div></div>
  <div class="stat"><div class="lb">里程</div><div class="val" id="st-km">–<small>km</small></div></div>
  <div class="stat"><div class="lb">行驶时长</div><div class="val" id="st-hours">–<small>小时</small></div></div>
</div>

<main>
  <div id="map"></div>
  <div class="overlay" id="loading" hidden>
    <div class="spin"></div>
    <div class="ov-text" id="loading-text">正在加载轨迹…</div>
  </div>
  <div class="overlay" id="error" hidden>
    <div class="ov-text" id="error-text">加载失败</div>
    <button class="retry-btn" id="retry">重试</button>
  </div>
  <div class="overlay" id="keyhint" hidden>
    <div class="hint-card">
      <h2>🗺️ 需要配置高德地图 Key</h2>
      <div class="h-sub">个人开发者免费</div>
      <ol>
        <li>打开 <a href="https://console.amap.com/dev/key/app" target="_blank" rel="noopener">高德开放平台控制台</a>, 创建应用</li>
        <li>添加 Key, 服务平台选择 <b>「Web端 (JS API)」</b></li>
        <li>在服务目录创建 <code>.env</code> 文件 (参考 <code>.env.example</code>):
          <br><code>AMAP_KEY=你的Key</code>
          <br><code>AMAP_SECURITY_CODE=你的安全密钥</code></li>
        <li>重启服务 (<code>./run.sh</code>) 后点击下方按钮</li>
      </ol>
      <div style="text-align:center;margin-top:16px">
        <button class="retry-btn" id="recheck">重新检测</button>
      </div>
    </div>
  </div>
  <div class="refine-tip" id="refine-tip" hidden>
    <div class="spin spin-s"></div>
    <span id="refine-tip-text">正在加载高精度轨迹…</span>
  </div>
</main>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sh-title" id="sh-date">–</div>
  <div class="sh-sub">行驶轨迹</div>
  <div class="sh-grid">
    <div class="sh-cell"><div class="lb">里程</div><div class="val" id="sh-km">–<small>km</small></div></div>
    <div class="sh-cell"><div class="lb">用时</div><div class="val" id="sh-dur">–</div></div>
  </div>
</div>

<script src="/tesla/static/gcj02.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);

/* ---------- 诊断探针: 浏览器端异常/高德请求失败自动回传服务端日志 ---------- */
let diagCount = 0;
function diag(stage, extra) {
  if (diagCount++ > 40) return;
  try {
    fetch("/tesla/map/api/diag", {
      method: "POST", headers: { "Content-Type": "application/json" },
      keepalive: true,
      body: JSON.stringify(Object.assign({ stage, ua: navigator.userAgent.slice(0, 100) }, extra)),
    }).catch(() => {});
  } catch (e) { /* 探针自身绝不能影响页面 */ }
}
window.addEventListener("error", e => diag("window_error",
  { msg: ((e.message || "") + " @" + (e.filename || "") + ":" + (e.lineno || 0)).slice(0, 300) }));
window.addEventListener("unhandledrejection", e => diag("promise_rejection",
  { msg: String((e.reason && e.reason.message) || e.reason || "").slice(0, 300) }));
(function patchConsole() {
  for (const lvl of ["error", "warn"]) {
    const orig = console[lvl].bind(console);
    console[lvl] = (...args) => {
      diag("console_" + lvl, { msg: args.map(a => String((a && a.message) || a)).join(" | ").slice(0, 400) });
      orig(...args);
    };
  }
})();
(function patchNetwork() {  // 捕获高德请求的真实失败 (状态码 + 响应体)
  const origFetch = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    return origFetch(url, opts).then(r => {
      if (r.status >= 400 && String(url).includes("amap.com"))
        diag("amap_fetch_" + r.status, { url: String(url).slice(0, 250) });
      return r;
    }).catch(e => {
      if (String(url).includes("amap.com"))
        diag("amap_fetch_err", { url: String(url).slice(0, 250), err: String(e).slice(0, 150) });
      throw e;
    });
  };
  const origOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (method, url, ...rest) {
    this.addEventListener("load", () => {
      if (this.status >= 400 && String(url).includes("amap.com"))
        diag("amap_xhr_" + this.status,
             { url: String(url).slice(0, 250), resp: String(this.responseText || "").slice(0, 250) });
    });
    return origOpen.call(this, method, url, ...rest);
  };
})();

let map = null, overlays = [], selected = null, selectedId = null, mapReady = false;
let range = "all";
let tracks = [];                  // 当前筛选后的粗轨迹对象
let tracksById = new Map();       // id → 粗轨迹对象 (点击信息用)
let coarseById = new Map();       // id → 粗线 Polyline
let detailLines = new Map();      // id → 细化线 Polyline (替换粗线)
let detailBand = null;            // 当前细化档位: null / 13 / 14 / 15
let detailCache = new Map();      // 档位 → Map(id → {box, pts})
let renderGen = 0;                // 渲染代号: 切换筛选时作废进行中的批次
let detailSeq = 0;                // 作废在途的细化请求
let refineTimer = null;

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (r.status === 401) { location.replace("/tesla/login"); throw new Error("未登录"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || ("HTTP " + r.status));
  return r.json();
}

const pad = n => String(n).padStart(2, "0");
const fmtDate = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

function rangeParams() {
  if (range === "all") return "";
  const now = new Date();
  if (range === "ytd") return "?from=" + now.getFullYear() + "-01-01";
  const from = new Date(now); from.setDate(from.getDate() - Number(range));
  return "?from=" + fmtDate(from);
}

function loadAMap(key, securityCode) {
  return new Promise((resolve, reject) => {
    if (securityCode) window._AMapSecurityConfig = { securityJsCode: securityCode };
    const s = document.createElement("script");
    s.src = "https://webapi.amap.com/maps?v=2.0&key=" + encodeURIComponent(key);
    s.onload = () => resolve();
    s.onerror = () => { diag("amap_script_fail", { src: s.src.slice(0, 120) });
                        reject(new Error("高德地图脚本加载失败, 请检查网络")); };
    document.head.appendChild(s);
  });
}

function showLoading(on, text) {
  $("#loading").hidden = !on;
  if (text) $("#loading-text").textContent = text;
}
function showError(msg) {
  $("#error").hidden = false;
  $("#error-text").textContent = msg || "加载失败";
}

function renderStats(s) {
  $("#stats").hidden = false;
  $("#st-drives").textContent = Number(s.drives).toLocaleString();
  $("#st-km").innerHTML = Number(s.distance_km).toLocaleString() + "<small>km</small>";
  $("#st-hours").innerHTML = (s.duration_min / 60).toFixed(1) + "<small>小时</small>";
}

// 分块异步绘制: 上千条线连坐标换算一次性做完会卡死主线程几秒,
// 每帧只画一小批, 期间页面可交互, 加载层实时显示进度
function renderTracks(list) {
  return new Promise(done => {
    const gen = ++renderGen;
    detailSeq++;                       // 作废在途的细化请求
    detailLines.clear();
    detailBand = null;                 // 粗线重画完成后按当前缩放重新细化
    showRefineTip(false);              // 重渲染阶段由大加载层接管提示
    if (selected) selected.setOptions({ strokeOpacity: 0.45, strokeWeight: 2, zIndex: 50 });
    selected = null; selectedId = null;
    closeSheet();
    if (overlays.length) map.remove(overlays);
    overlays = [];
    coarseById = new Map();
    tracks = list;
    tracksById = new Map(list.map(t => [t.id, t]));
    const total = list.length;
    if (!total) { done(); return; }
    showLoading(true, "正在绘制轨迹 0 / " + total + "…");
    const CHUNK = 50;
    let i = 0;
    (function step() {
      if (gen !== renderGen) { done(); return; }   // 已被新一轮渲染取代
      const end = Math.min(i + CHUNK, total);
      const batch = [];
      for (; i < end; i++) {
        const t = list[i];
        const path = t.pts.map(p => GCJ02.wgs84ToGcj02(p[0], p[1]));  // WGS-84 → GCJ-02
        const line = new AMap.Polyline({
          path, strokeColor: "#3987e5", strokeOpacity: 0.45, strokeWeight: 2,
          lineJoin: "round", cursor: "pointer", zIndex: 50,
        });
        line.on("click", () => selectTrack(line, t));
        batch.push(line);
        coarseById.set(t.id, line);
      }
      map.add(batch);
      overlays = overlays.concat(batch);
      if (i < total) {
        $("#loading-text").textContent = "正在绘制轨迹 " + i + " / " + total + "…";
        requestAnimationFrame(step);
      } else {
        map.setFitView(overlays, false, [40, 40, 40, 40]);
        showLoading(false);
        diag("tracks_rendered", { n: overlays.length });
        done();
        scheduleRefine();              // 若已缩放到 13 级以上, 立即细化视野内轨迹
      }
    })();
  });
}

/* ---------- 缩放渐进细化: 13 级以下用粗轨迹, 之上按视野请求高精度点位 ---------- */
const DETAIL_ZOOM = 13;
function bandOf(z) { return z >= 15 ? 15 : z >= 14 ? 14 : z >= DETAIL_ZOOM ? 13 : null; }

function scheduleRefine() {
  if (!map || !mapReady) return;
  clearTimeout(refineTimer);
  refineTimer = setTimeout(refineVisible, 350);   // 防抖: 缩放/平移稳定后再查
}

let refinePending = 0;   // 在途细化请求数, 并发/被作废时提示不错乱
function showRefineTip(on, n) {
  $("#refine-tip").hidden = !on;
  if (on) $("#refine-tip-text").textContent =
    n ? "正在加载视野内 " + n + " 条高精度轨迹…" : "正在加载高精度轨迹…";
}

function revertDetail() {   // 缩回 13 级以下 / 切档: 细化线还原为粗线
  for (const [id, line] of detailLines) {
    map.remove(line);
    const c = coarseById.get(id);
    if (c) {
      map.add(c);
      if (id === selectedId) {   // 选中高亮转移回粗线
        selected = c;
        c.setOptions({ strokeOpacity: 1, strokeWeight: 4, zIndex: 99 });
      }
    }
  }
  detailLines.clear();
  detailBand = null;
}

function applyDetail(id, pts) {   // 用高精度线替换该行程的粗线
  const t = tracksById.get(id);
  if (!t) return;
  const old = detailLines.get(id);
  if (old) map.remove(old);       // 之前只覆盖旧视野, 现在换成更宽的
  const c = coarseById.get(id);
  if (c) map.remove(c);
  const line = new AMap.Polyline({
    path: pts.map(p => GCJ02.wgs84ToGcj02(p[0], p[1])),
    strokeColor: "#3987e5", strokeOpacity: 0.45, strokeWeight: 2,
    lineJoin: "round", cursor: "pointer", zIndex: 50,
  });
  line.on("click", () => selectTrack(line, t));
  map.add(line);
  detailLines.set(id, line);
  if (id === selectedId) {        // 该线正被选中: 高亮转移到细化线
    selected = line;
    line.setOptions({ strokeOpacity: 1, strokeWeight: 4, zIndex: 99 });
  }
}

async function refineVisible() {
  const band = bandOf(map.getZoom());
  if (band === null) {
    if (detailBand !== null) revertDetail();
    return;
  }
  if (band !== detailBand) { revertDetail(); detailBand = band; }
  const b = map.getBounds();
  const M = 0.02;   // 视野外预留 ~2km, 平移时边缘不至于闪回粗线
  const box = { w: b.southwest.lng - M, e: b.northeast.lng + M,
                s: b.southwest.lat - M, n: b.northeast.lat + M };
  const cache = detailCache.get(band) || new Map();
  detailCache.set(band, cache);
  const seq = ++detailSeq;
  const need = [];
  let scanned = 0;
  for (const t of tracks) {
    if (scanned >= 80) break;    // 与后端 DETAIL_MAX_IDS 对齐
    if (!t.pts.some(p => p[0] >= box.w && p[0] <= box.e && p[1] >= box.s && p[1] <= box.n)) continue;
    scanned++;
    const c = cache.get(t.id);
    if (c && c.box.w <= box.w && c.box.e >= box.e && c.box.s <= box.s && c.box.n >= box.n) {
      if (!detailLines.has(t.id)) applyDetail(t.id, c.pts);   // 缓存已覆盖当前视野
      continue;
    }
    need.push(t.id);            // 没缓存或视野超出已查范围 → 请求
  }
  if (!need.length) return;
  refinePending++;
  showRefineTip(true, need.length);
  try {
    const d = await getJSON("/tesla/map/api/tracks/detail?ids=" + need.join(",") +
      "&zoom=" + band + "&w=" + box.w.toFixed(4) + "&s=" + box.s.toFixed(4) +
      "&e=" + box.e.toFixed(4) + "&n=" + box.n.toFixed(4));
    if (seq !== detailSeq || band !== detailBand) return;   // 已被新视野/重渲染取代
    for (const t of d.tracks) {
      cache.set(t.id, { box, pts: t.pts });
      applyDetail(t.id, t.pts);
    }
  } catch (err) {
    diag("detail_fail", { msg: String(err && err.message || err).slice(0, 150) });
  } finally {
    refinePending--;
    if (!refinePending) showRefineTip(false);
  }
}

function selectTrack(line, t) {
  if (selected) selected.setOptions({ strokeOpacity: 0.45, strokeWeight: 2, zIndex: 50 });
  selected = line;
  selectedId = t.id;
  line.setOptions({ strokeOpacity: 1, strokeWeight: 4, zIndex: 99 });
  map.setFitView([line], false, [70, 70, 70, 240]);
  $("#sh-date").textContent = t.date;
  $("#sh-km").innerHTML = t.km + "<small>km</small>";
  const m = t.min || 0;
  $("#sh-dur").textContent = m >= 60 ? Math.floor(m / 60) + " 小时 " + (m % 60) + " 分" : m + " 分钟";
  $("#backdrop").classList.add("show");
  $("#sheet").classList.add("show");
}
function closeSheet() {
  if (selected) selected.setOptions({ strokeOpacity: 0.45, strokeWeight: 2, zIndex: 50 });
  selected = null;
  selectedId = null;
  $("#backdrop").classList.remove("show");
  $("#sheet").classList.remove("show");
}

async function refresh(first) {
  $("#error").hidden = true;
  showLoading(true, first ? "正在加载轨迹…" : "正在更新…");
  try {
    const p = rangeParams();
    const [t, s] = await Promise.all([
      getJSON("/tesla/map/api/tracks" + p),
      getJSON("/tesla/map/api/summary" + p),
    ]);
    renderStats(s);
    await renderTracks(t.tracks);   // 分块绘制, 结束时自行收起加载层
    if (!t.tracks.length) showError("该时间段没有行驶轨迹");
  } catch (e) {
    showError(e.message);
    showLoading(false);
  }
}

async function boot() {
  try {
    // 加时间戳穿透浏览器缓存 (旧响应可能缓存了 amap_key: null)
    const cfg = await getJSON("/tesla/map/api/config?_=" + Date.now());
    diag("config_ok", { has_key: !!cfg.amap_key, has_scode: !!cfg.security_code });
    if (!cfg.amap_key) {
      $("#keyhint").hidden = false;
      return;
    }
    await loadAMap(cfg.amap_key, cfg.security_code);
    diag("amap_script_loaded", { ver: (window.AMap && AMap.version) || "?" });
    map = new AMap.Map("map", {
      mapStyle: "amap://styles/dark", zoom: 11, center: [114.05, 22.55],
    });
    map.on("complete", () => { mapReady = true; diag("map_complete"); });
    map.on("zoomend", scheduleRefine);   // 缩放/平移稳定后按视野细化轨迹
    map.on("moveend", scheduleRefine);
    diag("map_created");
    setTimeout(() => {
      if (!mapReady) {
        diag("map_incomplete_15s", { amap: !!window.AMap });
        showLoading(true, "地图引擎初始化未完成…已自动上报诊断, 请反馈给管理员");
      }
    }, 15000);
    await refresh(true);
    diag("boot_done", { tracks: overlays.length });
  } catch (e) {
    diag("boot_error", { msg: String(e && e.message || e).slice(0, 300) });
    if (e.message !== "未登录") showError(e.message);
  }
}

$("#chips-range").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b || b.dataset.v === range) return;
  document.querySelectorAll("#chips-range .chip").forEach(c => c.classList.toggle("on", c === b));
  range = b.dataset.v;
  refresh(false);
});
$("#retry").addEventListener("click", () => refresh(false));
$("#recheck").addEventListener("click", () => location.reload());
$("#backdrop").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
$("#logout").addEventListener("click", async () => {
  try { await fetch("/tesla/api/logout", { method: "POST" }); } catch (e) {}
  location.href = "/tesla/login";
});

boot();
</script>
</body>
</html>
