<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="记账">
<link rel="icon" type="image/png" sizes="32x32" href="/tesla/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/tesla/static/favicon.svg">
<link rel="apple-touch-icon" href="/tesla/static/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/tesla/static/manifest.json">
<script src="/tesla/static/lastpage.js?v=1"></script>
  <title>家庭记账 · My Home</title>
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --surface: #1c1c1e;
  --surface-2: #2c2c2e;
  --surface-3: #3a3a3c;
  --ink-1: #f5f5f7;
  --ink-2: rgba(235,235,245,.62);
  --ink-3: rgba(235,235,245,.32);
  --hairline: rgba(255,255,255,.09);
  --nav-bg: rgba(10,10,12,.72);
  --blue: #3987e5;
  --green: #5fd47f;
  --red: #e5695f;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink-1);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
               "Helvetica Neue", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45;
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button, a, summary { touch-action: manipulation; }

/* ---------- 顶部导航 (毛玻璃, 与全站一致) ---------- */
header {
  padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background: var(--nav-bg);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--hairline);
  z-index: 50;
}
.nav-row { display: flex; align-items: baseline; gap: 8px; }
.nav-row > * { flex-shrink: 0; }
#refresh-btn {
  align-self: center; display: flex; align-items: center; margin-left: auto;
  color: var(--ink-1); background: var(--surface-2);
  padding: 5px 9px; border-radius: 999px;
}
#refresh-btn:active { background: var(--surface-3); }
#refresh-btn.busy svg { animation: refresh-spin .8s linear infinite; }
@keyframes refresh-spin { to { transform: rotate(360deg); } }
.nav-menu { position: relative; align-self: center; margin-left: auto; }
.nav-menu summary {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: var(--ink-1); background: var(--surface-2);
  padding: 4px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  list-style: none; -webkit-user-select: none; user-select: none;
}
.nav-menu summary::-webkit-details-marker { display: none; }
.nav-menu summary:active { opacity: .7; }
.nav-menu[open] summary { background: var(--surface-3); }
.nav-menu .chev { transition: transform .18s; }
.nav-menu[open] .chev { transform: rotate(180deg); }
.nav-menu .menu {
  position: absolute; top: calc(100% + 8px); right: 0; min-width: 128px; z-index: 30;
  display: flex; flex-direction: column; padding: 5px;
  background: rgba(44,44,46,.88);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--hairline); border-radius: 14px;
  box-shadow: 0 12px 32px rgba(0,0,0,.5);
}
.nav-menu .menu a {
  font-size: 14px; color: var(--ink-1); text-decoration: none;
  padding: 9px 12px; border-radius: 10px; white-space: nowrap;
}
.nav-menu .menu a:active { background: var(--surface-3); }
.nav-menu .menu a.on { color: #7db3f0; }
.brand-menu { margin-left: 0; }
.brand-menu summary {
  font-size: 20px; font-weight: 700; letter-spacing: -.3px;
  background: none; padding: 0; border-radius: 0;
}
.brand-menu[open] summary { background: none; }
.brand-menu .chev { color: var(--ink-3); }
.brand-menu .menu { left: 0; right: auto; }
.nav-menu .menu .logout-row {
  color: #e5484d; border-top: 1px solid var(--hairline); margin-top: 5px;
}
.nav-menu .menu button {
  font-size: 14px; color: var(--ink-1); text-align: left;
  padding: 9px 12px; border-radius: 10px; white-space: nowrap;
}
@media (max-width: 479px) {
  header { position: relative; }
  .nav-menu { position: static; }
  .nav-menu .menu { left: 12px; right: 12px; }
}

/* ---------- 同步状态条 ---------- */
.sync-strip {
  display: flex; align-items: center; gap: 6px; justify-content: center;
  font-size: 11.5px; color: var(--ink-3); padding: 7px 14px;
  background: rgba(28,28,30,.6); border-bottom: 1px solid var(--hairline);
}
.sync-strip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.sync-strip.pending { color: #d8a35a; }
.sync-strip.pending .dot { background: #d8a35a; }
.sync-strip.off .dot { background: var(--ink-3); }

/* ---------- 月度栏 ---------- */
main {
  flex: 1; width: 100%; max-width: 560px; margin: 0 auto;
  padding: 14px 16px calc(env(safe-area-inset-bottom) + 96px);
}
.month-bar {
  display: flex; align-items: center; gap: 4px; margin-bottom: 10px;
}
.month-bar .mon { flex: 1; text-align: center; font-size: 17px; font-weight: 700; }
.month-bar button {
  flex: none; width: 34px; height: 34px; border-radius: 50%;
  color: var(--ink-2); background: var(--surface-2); font-size: 17px;
}
.month-bar button:active { background: var(--surface-3); }
.sum-row { display: flex; gap: 8px; margin-bottom: 12px; }
.sum-cell {
  flex: 1; background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 14px; padding: 10px 14px;
}
.sum-cell .k { font-size: 11.5px; color: var(--ink-3); }
.sum-cell .v { font-size: 19px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.sum-cell .v.in { color: var(--green); }

/* 记账人筛选 (横滑胶囊) */
.person-row {
  display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px;
  scrollbar-width: none;
}
.person-row::-webkit-scrollbar { display: none; }
.person-row button {
  flex: none; font-size: 12.5px; color: var(--ink-2); background: var(--surface-2);
  padding: 5px 13px; border-radius: 999px; border: 1px solid transparent;
}
.person-row button.on { color: #7db3f0; border-color: rgba(57,135,229,.5); }

/* ---------- 账目列表 (按日分组) ---------- */
.day-group { margin-bottom: 14px; }
.day-head {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--ink-3); padding: 0 4px 6px;
}
.entries { background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; }
.entry {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-bottom: 1px solid var(--hairline);
}
.entry:last-child { border-bottom: 0; }
.entry:active { background: var(--surface-2); }
.entry .cat-dot {
  flex: none; width: 34px; height: 34px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; background: var(--surface-2);
}
.entry .mid { flex: 1; min-width: 0; }
.entry .l1 {
  font-size: 15px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.entry .l2 { font-size: 11.5px; color: var(--ink-3); margin-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry .amt { flex: none; font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
.entry .amt.in { color: var(--green); }
.list-empty { text-align: center; color: var(--ink-3); font-size: 13px; padding: 44px 0; }

/* ---------- 记一笔 (悬浮) ---------- */
#fab {
  position: fixed; right: 18px;
  bottom: calc(env(safe-area-inset-bottom) + 22px);
  width: 54px; height: 54px; border-radius: 50%;
  background: var(--blue); color: #fff; font-size: 28px; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(57,135,229,.4); z-index: 60;
}
#fab:active { transform: scale(.94); }

/* ---------- 记/改一笔 (底部弹层) ---------- */
#sheet-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 70;
  opacity: 0; transition: opacity .2s;
}
#sheet-mask.on { opacity: 1; }
#sheet {
  position: fixed; left: 0; right: 0;
  bottom: calc(env(safe-area-inset-bottom) * -1);
  padding-bottom: calc(env(safe-area-inset-bottom) + 14px);
  background: var(--surface); border-radius: 20px 20px 0 0;
  border-top: 1px solid var(--hairline);
  z-index: 71; transform: translateY(102%); transition: transform .25s;
  max-width: 560px; margin: 0 auto; padding-left: 18px; padding-right: 18px; padding-top: 8px;
}
#sheet.on { transform: translateY(0); }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--hairline); margin: 2px auto 12px; }
#sheet h2 { font-size: 16px; font-weight: 650; margin-bottom: 12px; }
.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; margin-bottom: 12px; }
.seg button { flex: 1; padding: 8px 0; border-radius: 8px; font-size: 14px; color: var(--ink-2); }
.seg button.on.exp { background: #48484a; color: var(--ink-1); }
.seg button.on.inc { background: rgba(48,209,88,.22); color: var(--green); }
.amt-line { display: flex; align-items: baseline; gap: 6px; margin-bottom: 12px; }
.amt-line .cur { font-size: 26px; font-weight: 700; color: var(--ink-2); }
.amt-line input {
  flex: 1; border: 0; background: none; outline: 0; color: var(--ink-1);
  font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;
  caret-color: var(--blue); min-width: 0;
}
.cat-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
.cat-chips::-webkit-scrollbar { display: none; }
.cat-chips button {
  flex: none; font-size: 13px; padding: 6px 14px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid transparent;
}
.cat-chips button.on { color: #7db3f0; border-color: rgba(57,135,229,.5); }
.row2 { display: flex; gap: 10px; margin-bottom: 6px; }
.field { flex: 1; display: flex; align-items: center; gap: 8px;
  background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.field span { font-size: 12.5px; color: var(--ink-3); flex: none; }
.field input { flex: 1; min-width: 0; border: 0; background: none; outline: 0;
  color: var(--ink-1); font: inherit; caret-color: var(--blue); }
input[type="date"]::-webkit-date-edit { color: var(--ink-1); }
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .5; }
.sheet-acts { display: flex; gap: 10px; margin-top: 12px; }
.sheet-acts .primary {
  flex: 1; background: var(--blue); color: #fff; font-size: 15px; font-weight: 600;
  padding: 12px 0; border-radius: 12px;
}
.sheet-acts .primary:active { transform: scale(.98); }
.sheet-acts .primary:disabled { opacity: .4; }
.sheet-acts .danger {
  flex: none; color: var(--red); font-size: 14px; padding: 0 18px; border-radius: 12px;
  border: 1px solid rgba(229,105,95,.35);
}
.sheet-acts .danger:active { background: rgba(229,105,95,.12); }
</style>
</head>
<body>

<header>
  <div class="nav-row">
    <details class="nav-menu brand-menu" id="brand-menu">
      <summary>家庭记账<svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="menu">
        <a href="/tesla/charging">充电记录</a>
        <a href="/tesla/stats">充电统计</a>
        <a href="/tesla/chargemap">充电地图</a>
        <a href="/tesla/map">足迹地图</a>
        <a href="/tesla/trips">行程列表</a>
        <a href="/tesla/groups">行程分组</a>
        <a href="/tesla/live">当前驾驶</a>
        <a href="/tesla/settings">软件设置</a>
        <a class="on" href="/bookkeeping">家庭记账</a>
        <a class="admin-only" href="/tesla/accounts">账号管理</a>
        <a href="/tesla/changelog">更新日志</a>
        <button class="logout-row" id="logout" title="退出登录">退出登录</button>
      </div>
    </details>
    <button id="refresh-btn" aria-label="立即同步"><svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><path d="M12 7a5 5 0 1 1-1.46-3.54" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 1.6v2.4H9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</header>

<div class="sync-strip" id="sync-strip">
  <span class="dot"></span><span id="sync-text">本地账本</span>
</div>

<main>
  <div class="month-bar">
    <button id="mon-prev" aria-label="上月">‹</button>
    <div class="mon" id="mon-label"></div>
    <button id="mon-next" aria-label="下月">›</button>
  </div>
  <div class="sum-row">
    <div class="sum-cell"><div class="k">支出</div><div class="v" id="sum-out">¥0</div></div>
    <div class="sum-cell"><div class="k">收入</div><div class="v in" id="sum-in">¥0</div></div>
  </div>
  <div class="person-row" id="person-row"></div>
  <div id="entry-list"></div>
  <div class="list-empty" id="list-empty" hidden>这个月还没有账目</div>
</main>

<button id="fab" aria-label="记一笔">＋</button>

<div id="sheet-mask" hidden></div>
<div id="sheet" hidden>
  <div class="grab"></div>
  <h2 id="sheet-title">记一笔</h2>
  <div class="seg" id="kind-seg">
    <button data-kind="expense" class="exp on">支出</button>
    <button data-kind="income" class="inc">收入</button>
  </div>
  <div class="amt-line"><span class="cur">¥</span><input id="f-amount" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="0.00" autocomplete="off"></div>
  <div class="cat-chips" id="cat-chips"></div>
  <div class="row2">
    <div class="field"><span>日期</span><input id="f-date" type="date"></div>
    <div class="field"><span>备注</span><input id="f-note" maxlength="200" placeholder="选填" autocomplete="off"></div>
  </div>
  <div class="sheet-acts">
    <button class="primary" id="sheet-save">保存</button>
    <button class="danger" id="sheet-del" hidden>删除</button>
  </div>
</div>

<script src="/tesla/static/bookkeeping-merge.js?v=1"></script>
<script src="/tesla/static/me.js?v=1"></script>
<script src="/tesla/static/bookkeeping.js?v=1"></script>
</body>
</html>
