<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 首启引导页: 四页 (管理员/数据源/地图/完成) 配齐之前是唯一入口,
     不允许跳过 —— 线性前进, 只有「上一步/下一步」(步骤条只展示进度,
     不可点; 2026-10-13 口径); Tesla 应用的门 (/tesla) 会把人送回来;
     中途退出下次从缺口页接着走 (起步页数由 setup.js 查 /api/setup-status
     决定)。页面本身免登录, 建管理员即种会话 cookie -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=1">
<link rel="manifest" href="/static/manifest.json">
  <title>初始化 · My Home</title>
<link rel="stylesheet" href="/static/css/setup-page.css?v=10">
</head>
<body data-done="/tesla?view=live">   <!-- 进应用直落状态页: ?view= 优先于壳
     的 lastView 回放, 不然会回到上次停留过的页面 (2026-10-13 口径) -->
<script src="/static/no-zoom.js?v=2"></script>
<div class="card" id="card">
  <div class="icon">⚡</div>
  <h1>My Home</h1>
  <!-- 步骤条只展示进度 (active=当前, done=已过), 不可点 —— 跳步退役,
       想回改走「上一步」一页页退 (2026-10-13 四页线性版) -->
  <ol class="steps" id="steps">
    <li>管理员</li><li>数据源</li><li>地图</li><li>完成</li>
  </ol>
  <form id="form1" hidden autocomplete="on">
    <div class="field">
      <label for="su-name">名称</label>
      <input id="su-name" name="name" type="text" autocapitalize="off"
             autocorrect="off" autocomplete="nickname" minlength="2"
             maxlength="20" placeholder="2~20 个字符" required>
    </div>
    <div class="field">
      <label for="su-pass">密码</label>
      <input id="su-pass" name="new-password" type="password"
             autocomplete="new-password" minlength="6" maxlength="64" required>
      <button type="button" class="eye-btn" id="eye" aria-label="显示密码">
        <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg id="eye-slash" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>
    <div class="field">
      <label for="su-pass2">确认</label>
      <input id="su-pass2" name="confirm-password" type="password"
             autocomplete="new-password" minlength="6" maxlength="64" required>
    </div>
    <!-- 下一步 (setup.js): 三个框填全才亮, 点击走原生校验 (required/
         minlength 的气泡) 后建号前进; 管理员已建 (续走回看 / 409) 时表单
         转 noValidate 空框直进 —— 建号是首启唯一入口, 已建过没有可改的值。
         按钮本体住常驻底栏 (页面底部 .dock), 靠 form 属性回绑本表单 -->
    <div class="err"></div>
  </form>
  <form id="form2" hidden>
    <div class="field">
      <label for="tm-host">地址</label>
      <input id="tm-host" type="text" autocapitalize="off" autocorrect="off"
             placeholder="TeslaMate PostgreSQL 主机" required>
    </div>
    <div class="field">
      <label for="tm-port">端口</label>
      <input id="tm-port" type="text" inputmode="numeric" placeholder="5432">
    </div>
    <div class="field">
      <label for="tm-user">用户</label>
      <input id="tm-user" type="text" autocapitalize="off" autocorrect="off"
             placeholder="teslamate">
    </div>
    <div class="field">
      <label for="tm-pass">密码</label>
      <input id="tm-pass" type="password" placeholder="未设置">
    </div>
    <div class="field">
      <label for="tm-name">库名</label>
      <input id="tm-name" type="text" autocapitalize="off" autocorrect="off"
             placeholder="teslamate">
    </div>
    <!-- 测试闸 (setup-gates.js): 「测试连接」拿框里候选实测 (空字段回落
         现值), 通了「下一步」才解锁; 输入一改作废重测; 测试钮本身也是
         灰的 —— 必填项填全 (setup-gates 按输入现算) 才亮。「上一步」退
         回管理员页 (钮住底栏), 表单值原样留着 —— 没动就仍是测过的口
         径, 动了才要重测 (2026-10-13 四页线性版) -->
    <button type="button" class="btn ghost solo" id="tm-test" disabled>测试连接</button>
    <div class="err"></div>
  </form>
  <form id="form3" hidden>
    <div class="field">
      <label for="amap-key">地图 Key</label>
      <!-- required 退役: 测试闸管必填 (没 Key 测不过), 空框回落现值的续走
           不再被迫重填明文 (2026-10-12 口径) -->
      <input id="amap-key" type="text" autocapitalize="off" autocorrect="off"
             placeholder="未设置">
    </div>
    <div class="field">
      <label for="amap-code">安全码</label>
      <input id="amap-code" type="text" autocapitalize="off" autocorrect="off"
             placeholder="未设置">
    </div>
    <div class="field">
      <label for="amap-web">Web Key</label>
      <input id="amap-web" type="text" autocapitalize="off" autocorrect="off"
             placeholder="未设置">
    </div>
    <!-- 测试闸 (setup-gates.js): 两把 Key 都真测 —— Web Key 服务端
         逆地理, 地图 Key iframe 探针, 全过「下一步」才解锁; 测试钮本身
         也是灰的 —— 两把 Key 填全 (框里或存过现值) 才亮。「上一步」退
         回数据源页改值 (钮住底栏), 改了要重测才能再往下 -->
    <button type="button" class="btn ghost solo" id="amap-test" disabled>测试</button>
    <div class="err"></div>
  </form>
  <!-- 第四页 (完成): 前三页一路「下一步」真存过来, 进门先把所填汇总过
       目一遍 (setup.js 现拉, 敏感信息只给掩码/****), 确认后「进入应用」
       显式跳转 (直落状态页), 不再自动跳 (2026-10-13 口径) -->
  <div class="done" id="done" hidden>
    <p>所有设置已完成</p>
    <dl class="done-summary" id="done-summary" hidden></dl>
  </div>
</div>
<!-- 常驻底栏 (2026-10-13 用户口径: 下一步/上一步/进入应用钉在屏幕底部,
     与上面的内容分离 —— 表单再长自己滚, 按钮恒在手边)。挪出卡片是刻
     意的: 卡片的 .shake 报错动画带 transform, 变换中的祖先会把 fixed
     子件改锚 (底栏会跟着卡片抖); 按钮靠 form 属性回绑各自表单, 提交语
     义照旧。data-pages = 哪几页可见 (setup.js 的 showStep 切页时翻) -->
<div class="dock" id="dock">
  <button type="submit" class="btn" id="next1" form="form1" hidden data-pages="0" disabled>下一步</button>
  <button type="button" class="btn ghost" id="back2" form="form2" hidden data-pages="1">上一步</button>
  <button type="submit" class="btn" id="next2" form="form2" hidden data-pages="1" disabled>下一步</button>
  <button type="button" class="btn ghost" id="back3" form="form3" hidden data-pages="2">上一步</button>
  <button type="submit" class="btn" id="next3" form="form3" hidden data-pages="2" disabled>下一步</button>
  <button type="button" class="btn" id="enter" hidden data-pages="3">进入应用</button>
</div>
<script src="/tesla/static/js/tesla-map-adapter.js?v=14"></script>
<script src="/static/setup.js?v=12"></script>
<script src="/static/setup-gates.js?v=6"></script>
</body>
</html>
