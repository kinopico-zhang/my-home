<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Home">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=1">
  <link rel="manifest" href="/static/manifest.json">
  <title>My Home</title>
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --surface: #1c1c1e;
  --surface-2: #2c2c2e;
  --surface-3: #3a3a3c;
  --ink-1: #f5f5f7;
  --ink-2: rgba(235,235,245,.62);
  --ink-3: rgba(235,235,245,.32);
  --hairline: rgba(255,255,255,.09);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
/* 触屏双击控件不再触发整页放大 (manipulation 保留平移/捏合, 只去掉双击缩放) */
button, a, summary { touch-action: manipulation; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink-1);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
               "Helvetica Neue", system-ui, sans-serif;
  font-size: 15px; display: flex; align-items: center; justify-content: center;
  padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
}
.card {
  width: 100%; max-width: 340px;
  background: var(--surface); border-radius: 20px;
  border: 1px solid var(--hairline);
  padding: 34px 22px 22px; text-align: center;
}
.icon {
  width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 16px;
  background: linear-gradient(160deg, #3987e5, #1fa349);
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
}
h1 { font-size: 21px; font-weight: 700; letter-spacing: -.3px; }
.sub { font-size: 13px; color: var(--ink-2); margin: 5px 0 22px; }
/* 应用入口卡 */
.apps { text-align: left; }
.app {
  display: flex; align-items: center; gap: 13px;
  background: var(--surface-2); border-radius: 14px;
  padding: 13px 14px; margin-bottom: 10px; text-decoration: none;
  color: var(--ink-1); transition: opacity .15s;
}
.app:active { opacity: .8; }
.app .app-ico { flex: none; width: 40px; height: 40px; border-radius: 11px;
  background: var(--surface-3); display: flex; align-items: center;
  justify-content: center; font-size: 21px; }
.app .app-txt { flex: 1; min-width: 0; }
.app .app-txt b { display: block; font-size: 15.5px; letter-spacing: -.2px; }
.app .app-txt small { display: block; font-size: 12px; color: var(--ink-2);
  margin-top: 2px; }
.app .chev { flex: none; color: var(--ink-3); font-size: 18px; }
/* 账号管理 (管理员专属, JS 放行) + 退出登录 */
.acts { display: flex; border-top: 1px solid var(--hairline); margin-top: 6px; }
.acts button, .acts a {
  flex: 1; padding: 13px 0; background: none; border: 0; color: var(--ink-2);
  font: inherit; font-size: 13.5px; text-decoration: none; cursor: pointer;
}
.acts button:active, .acts a:active { color: var(--ink-1); }
.acts .sep { flex: none; width: 1px; background: var(--hairline); }
.admin-only { display: none; }
.admin-only.admin-show { display: block; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="icon">🏠</div>
  <h1>My Home</h1>
  <div class="sub" id="sub">…</div>
  <div class="apps" id="apps">
    <a class="app" href="/tesla/charging">
      <span class="app-ico">🚗</span>
      <span class="app-txt"><b>My Tesla</b><small>充电 · 足迹 · 行程</small></span>
      <span class="chev">›</span>
    </a>
    <a class="app" href="/bookkeeping">
      <span class="app-ico">💰</span>
      <span class="app-txt"><b>My Money</b><small>家庭记账 · 多人同步</small></span>
      <span class="chev">›</span>
    </a>
    <a class="app" href="/music">
      <span class="app-ico">🎵</span>
      <span class="app-txt"><b>My Music</b><small>曲库 · 歌词 · 随身听</small></span>
      <span class="chev">›</span>
    </a>
  </div>
  <div class="acts">
    <a class="admin-only" id="accounts-link" href="/accounts">账号管理</a>
    <span class="sep admin-only" id="accounts-sep"></span>
    <button id="logout" type="button">退出登录</button>
  </div>
</div>
<script src="/static/home.js?v=1"></script>
</body>
</html>
