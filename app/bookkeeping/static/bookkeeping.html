<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Money">
<link rel="icon" type="image/png" sizes="32x32" href="/bookkeeping/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/bookkeeping/static/favicon.svg">
<link rel="apple-touch-icon" href="/bookkeeping/static/apple-touch-icon.png?v=3">
  <link rel="manifest" href="/bookkeeping/static/manifest.json">
  <title>My Money</title>
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --surface: #1c1c1e;
  --surface-2: #2c2c2e;
  --surface-3: #3a3a3c;
  --ink-1: #f5f5f7;
  --ink-2: rgba(235,235,245,.62);
  --ink-3: rgba(235,235,245,.32);
  --hairline: rgba(255,255,255,.09);
  --nav-bg: rgba(10,10,12,.72);
  --blue: #3987e5;
  --green: #5fd47f;
  --red: #e5695f;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink-1);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
               "Helvetica Neue", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45;
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button, a, summary { touch-action: manipulation; }

/* ---------- 顶部导航 (毛玻璃, 与全站一致) ---------- */
header {
  padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background: var(--nav-bg);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--hairline);
  z-index: 50;
}
.nav-row { display: flex; align-items: baseline; gap: 8px; }
.nav-row > * { flex-shrink: 0; }
#refresh-btn {
  align-self: center; display: flex; align-items: center; margin-left: auto;
  color: var(--ink-1); background: var(--surface-2);
  padding: 5px 9px; border-radius: 999px;
}
#refresh-btn:active { background: var(--surface-3); }
#refresh-btn.busy svg { animation: refresh-spin .8s linear infinite; }
@keyframes refresh-spin { to { transform: rotate(360deg); } }
.nav-menu { position: relative; align-self: center; margin-left: auto; }
.nav-menu summary {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: var(--ink-1); background: var(--surface-2);
  padding: 4px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  list-style: none; -webkit-user-select: none; user-select: none;
}
.nav-menu summary::-webkit-details-marker { display: none; }
.nav-menu summary:active { opacity: .7; }
.nav-menu[open] summary { background: var(--surface-3); }
.nav-menu .chev { transition: transform .18s; }
.nav-menu[open] .chev { transform: rotate(180deg); }
.nav-menu .menu {
  position: absolute; top: calc(100% + 8px); right: 0; min-width: 128px; z-index: 30;
  display: flex; flex-direction: column; padding: 5px;
  background: rgba(44,44,46,.88);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--hairline); border-radius: 14px;
  box-shadow: 0 12px 32px rgba(0,0,0,.5);
}
.nav-menu .menu a {
  font-size: 14px; color: var(--ink-1); text-decoration: none;
  padding: 9px 12px; border-radius: 10px; white-space: nowrap;
}
.nav-menu .menu a:active { background: var(--surface-3); }
.nav-menu .menu a.on { color: #7db3f0; }
.brand-menu { margin-left: 0; }
.brand-menu summary {
  font-size: 20px; font-weight: 700; letter-spacing: -.3px;
  background: none; padding: 0; border-radius: 0;
}
.brand-menu[open] summary { background: none; }
.brand-menu .chev { color: var(--ink-3); }
.brand-menu .menu { left: 0; right: auto; }
.nav-menu .menu .logout-row {
  color: #e5484d; border-top: 1px solid var(--hairline); margin-top: 5px;
}
.nav-menu .menu button {
  font-size: 14px; color: var(--ink-1); text-align: left;
  padding: 9px 12px; border-radius: 10px; white-space: nowrap;
}
@media (max-width: 479px) {
  header { position: relative; }
  .nav-menu { position: static; }
  .nav-menu .menu { left: 12px; right: 12px; }
}

/* ---------- 同步状态条 ---------- */
.sync-strip {
  display: flex; align-items: center; gap: 6px; justify-content: center;
  font-size: 11.5px; color: var(--ink-3); padding: 7px 14px;
  background: rgba(28,28,30,.6); border-bottom: 1px solid var(--hairline);
}
.sync-strip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.sync-strip.pending { color: #d8a35a; }
.sync-strip.pending .dot { background: #d8a35a; }
.sync-strip.off .dot { background: var(--ink-3); }

/* ---------- 月度栏 ---------- */
main {
  flex: 1; width: 100%; max-width: 560px; margin: 0 auto;
  padding: 14px 16px calc(env(safe-area-inset-bottom) + 96px);
}
.month-bar {
  display: flex; align-items: center; gap: 4px; margin-bottom: 10px;
}
.month-bar .mon { flex: 1; text-align: center; font-size: 17px; font-weight: 700; }
.month-bar button {
  flex: none; width: 34px; height: 34px; border-radius: 50%;
  color: var(--ink-2); background: var(--surface-2); font-size: 17px;
}
.month-bar button:active { background: var(--surface-3); }
.sum-row { display: flex; gap: 8px; margin-bottom: 12px; }
.sum-cell {
  flex: 1; background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 14px; padding: 10px 14px;
}
.sum-cell .k { font-size: 11.5px; color: var(--ink-3); }
.sum-cell .v { font-size: 19px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.sum-cell .v.in { color: var(--green); }

/* 记账人筛选 (横滑胶囊) */
.person-row {
  display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px;
  scrollbar-width: none;
}
.person-row::-webkit-scrollbar { display: none; }
.person-row button {
  flex: none; font-size: 12.5px; color: var(--ink-2); background: var(--surface-2);
  padding: 5px 13px; border-radius: 999px; border: 1px solid transparent;
}
.person-row button.on { color: #7db3f0; border-color: rgba(57,135,229,.5); }

/* ---------- 账目列表 (按日分组) ---------- */
.day-group { margin-bottom: 14px; }
.day-head {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--ink-3); padding: 0 4px 6px;
}
.entries { background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; }
.entry {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-bottom: 1px solid var(--hairline);
}
.entry:last-child { border-bottom: 0; }
.entry:active { background: var(--surface-2); }
.entry .cat-dot {
  flex: none; width: 34px; height: 34px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; background: var(--surface-2);
  filter: grayscale(1) brightness(1.25);   /* 与类别格子同一副单色面孔 */
}
.entry .mid { flex: 1; min-width: 0; }
.entry .l1 {
  font-size: 15px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.entry .l2 { font-size: 11.5px; color: var(--ink-3); margin-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry .amt { flex: none; font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
.entry .amt.in { color: var(--green); }
.list-empty { text-align: center; color: var(--ink-3); font-size: 13px; padding: 44px 0; }

/* ---------- 记一笔 (悬浮) ---------- */
#fab {
  position: fixed; right: 18px;
  bottom: calc(env(safe-area-inset-bottom) + 22px);
  width: 54px; height: 54px; border-radius: 50%;
  background: var(--blue); color: #fff; font-size: 28px; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(57,135,229,.4); z-index: 60;
}
#fab:active { transform: scale(.94); }

/* ---------- 记/改一笔 (底部弹层) ---------- */
#sheet-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 70;
  opacity: 0; transition: opacity .2s;
}
#sheet-mask.on { opacity: 1; }
#sheet {
  position: fixed; left: 0; right: 0;
  bottom: calc(env(safe-area-inset-bottom) * -1);
  padding-bottom: 6px;
  background: var(--surface); border-radius: 20px 20px 0 0;
  border-top: 1px solid var(--hairline);
  z-index: 71; transform: translateY(102%); transition: transform .25s;
  max-width: 560px; margin: 0 auto; padding-left: 18px; padding-right: 18px; padding-top: 8px;
  max-height: calc(100dvh - 24px); overflow-y: auto;   /* 键盘展开后小屏可滚 */
  overflow-x: hidden;                 /* overflow-y:auto 会把另一轴隐式变 auto, */
  overscroll-behavior-y: contain;     /* 日期/备注行超宽 7px 就能整层左右拖 */
}
#sheet.on { transform: translateY(0); }
.grab-zone { padding: 7px 0 3px; margin: 0 0 8px; touch-action: none; cursor: pointer; }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--hairline); margin: 0 auto; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet-head h2 { flex: 1; text-align: center; font-size: 16px; font-weight: 650; }
.head-btn { font-size: 13.5px; color: var(--ink-2); padding: 5px 2px; min-width: 42px; }
#sheet-del { color: var(--red); text-align: right; }
.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; margin-bottom: 12px; }
.seg button { flex: 1; padding: 8px 0; border-radius: 8px; font-size: 14px; color: var(--ink-2); }
.seg button.on.exp { background: #48484a; color: var(--ink-1); }
.seg button.on.inc { background: rgba(48,209,88,.22); color: var(--green); }
.amt-line { display: flex; align-items: baseline; gap: 6px; margin-bottom: 12px; }
.amt-line .amt-eq {           /* 四则表达式的实时结果 (= 20.5) */
  flex: none; font-size: 14px; font-weight: 600; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.amt-line.shake { animation: amt-shake .3s; }
@keyframes amt-shake {
  20% { transform: translateX(-5px); } 40% { transform: translateX(4px); }
  60% { transform: translateX(-3px); } 80% { transform: translateX(2px); }
}
.amt-line .cur { font-size: 26px; font-weight: 700; color: var(--ink-2); }
.amt-line input {
  flex: 1; border: 0; background: none; outline: 0; color: var(--ink-1);
  font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;
  caret-color: var(--blue); min-width: 0;
}
.cat-tiles {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px 4px;
  margin-bottom: 8px;
  max-height: 34dvh; overflow-y: auto; overscroll-behavior: contain;
  padding-right: 2px;                     /* 滚动条位不压格子 */
}
.cat-tiles .tile { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.cat-tiles .ti {
  width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2);
  display: flex; align-items: center; justify-content: center; font-size: 21px;
  filter: grayscale(1) brightness(1.25);   /* emoji 单色化: 灰阶去彩, 提亮防暗色图标沉底 */
}
.cat-tiles .tile:active .ti { background: var(--surface-3); }
.cat-tiles .tn { font-size: 11px; color: var(--ink-2); }
.cat-tiles .tile.on .ti { background: var(--blue); }
.cat-tiles .tile.on .tn { color: #fff; font-weight: 600; }
.row2 { display: flex; gap: 10px; margin-bottom: 6px; }
.field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
  background: var(--surface-2); border-radius: 10px; padding: 9px 11px; }
.field span { font-size: 12.5px; color: var(--ink-3); flex: none; }
.field input { flex: 1; min-width: 0; border: 0; background: none; outline: 0;
  color: var(--ink-1); font: inherit; caret-color: var(--blue); }
input[type="date"]::-webkit-date-edit { color: var(--ink-1); }
input[type="time"]::-webkit-date-edit { color: var(--ink-1); }
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .5; }
.tag-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 8px; }
.tag-chips button {
  font-size: 11.5px; padding: 3px 10px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-3); border: 1px solid transparent;
}
.tag-chips button.on { color: #7db3f0; border-color: rgba(57,135,229,.5); }
/* ---------- 金额键盘 (紧凑) -----------
   三列数字 + 运算符列, 右列上下两枚大键: ⌫(浅) / 完成(蓝)。
   ⌫ 按住半秒清空; 吸底常驻 (弹层开着就在, 类别区在上面滚动)。 */
.amt-pad {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px;
  position: sticky; bottom: 0; z-index: 5;
  max-height: 0; opacity: 0; overflow: hidden;
  transition: max-height .22s ease, opacity .16s ease, margin-top .22s ease;
}
.amt-pad.on {
  max-height: 216px; opacity: 1;
  background: var(--surface); border-top: 1px solid var(--hairline);
  margin: 10px -18px 0; padding: 8px 18px calc(env(safe-area-inset-bottom) + 8px);
}
.amt-pad .k {
  height: 38px; border-radius: 10px; font-size: 18px; color: var(--ink-1);
  background: var(--surface-3); font-variant-numeric: tabular-nums;
}
.amt-pad .k:active { filter: brightness(.72); }       /* 按下变暗 (iOS 键感) */
.amt-pad .k.op { background: #ff9f0a; }               /* 运算符 = 计算器橙 */
.amt-pad .k.util { grid-column: 5; grid-row: 1 / span 2; height: auto;
  background: #a5a5a5; color: #141416; font-size: 18px; }
.amt-pad .k.done { grid-column: 5; grid-row: 3 / span 2; height: auto;
  background: var(--blue); color: #fff; font-size: 15px; font-weight: 600; }
.amt-pad .k.zero { grid-column: span 2; }
</style>
</head>
<body>

<header>
  <div class="nav-row">
    <details class="nav-menu brand-menu" id="brand-menu">
      <summary>My Money<svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="menu">
        <a href="/bookkeeping/changelog">更新日志</a>
        <button class="logout-row" id="logout" title="退出登录">退出登录</button>
      </div>
    </details>
    <button id="refresh-btn" aria-label="立即同步"><svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><path d="M12 7a5 5 0 1 1-1.46-3.54" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 1.6v2.4H9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</header>

<div class="sync-strip" id="sync-strip">
  <span class="dot"></span><span id="sync-text">本地账本</span>
</div>

<main>
  <div class="month-bar">
    <button id="mon-prev" aria-label="上月">‹</button>
    <div class="mon" id="mon-label"></div>
    <button id="mon-next" aria-label="下月">›</button>
  </div>
  <div class="sum-row">
    <div class="sum-cell"><div class="k">支出</div><div class="v" id="sum-out">¥0</div></div>
    <div class="sum-cell"><div class="k">收入</div><div class="v in" id="sum-in">¥0</div></div>
  </div>
  <div class="person-row" id="person-row"></div>
  <div id="entry-list"></div>
  <div class="list-empty" id="list-empty" hidden>这个月还没有账目</div>
</main>

<button id="fab" aria-label="记一笔">＋</button>

<div id="sheet-mask" hidden></div>
<div id="sheet" hidden>
  <div class="grab-zone" id="grab-zone"><div class="grab"></div></div>
  <div class="sheet-head">
    <button class="head-btn" id="sheet-close">关闭</button>
    <h2 id="sheet-title">记一笔</h2>
    <button class="head-btn" id="sheet-del" hidden>删除</button>
  </div>
  <div class="seg" id="kind-seg">
    <button data-kind="expense" class="exp on">支出</button>
    <button data-kind="income" class="inc">收入</button>
  </div>
  <div class="amt-line" id="amt-line"><span class="cur">¥</span><input id="f-amount" type="text" inputmode="none" placeholder="0.00" autocomplete="off"><span class="amt-eq" id="amt-eq"></span></div>
  <div class="cat-tiles" id="cat-tiles"></div>
  <div class="row2">
    <div class="field"><span>日期</span><input id="f-date" type="date"></div>
    <div class="field"><span>时间</span><input id="f-time" type="time"></div>
    <div class="field"><span>备注</span><input id="f-note" maxlength="200" placeholder="选填" autocomplete="off"></div>
  </div>
  <div class="row2">
    <div class="field"><span>标签</span><input id="f-tags" maxlength="80" placeholder="空格分隔, 选填" autocomplete="off"></div>
  </div>
  <div class="tag-chips" id="tag-chips" hidden></div>
  <div class="amt-pad" id="amt-pad" aria-label="金额键盘">
    <button class="k" data-k="7">7</button><button class="k" data-k="8">8</button><button class="k" data-k="9">9</button><button class="k op" data-k="/">÷</button>
    <button class="k util" data-k="back">⌫</button>
    <button class="k" data-k="4">4</button><button class="k" data-k="5">5</button><button class="k" data-k="6">6</button><button class="k op" data-k="*">×</button>
    <button class="k" data-k="1">1</button><button class="k" data-k="2">2</button><button class="k" data-k="3">3</button><button class="k op" data-k="-">−</button>
    <button class="k done" data-k="done">完成</button>
    <button class="k zero" data-k="0">0</button><button class="k" data-k=".">.</button><button class="k op" data-k="+">＋</button>
  </div>
</div>

<script src="/static/menu-user.js?v=2"></script>
<script src="/bookkeeping/static/bookkeeping-merge.js?v=2"></script>
<script src="/bookkeeping/static/amount-calculator.js?v=1"></script>
<script src="/bookkeeping/static/bookkeeping.js?v=4"></script>
</body>
</html>
