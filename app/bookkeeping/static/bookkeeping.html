<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Money">
<link rel="icon" type="image/png" sizes="32x32" href="/bookkeeping/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/bookkeeping/static/favicon.svg">
<link rel="apple-touch-icon" href="/bookkeeping/static/apple-touch-icon.png?v=3">
  <link rel="manifest" href="/bookkeeping/static/manifest.json">
  <title>My Money</title>
<link rel="stylesheet" href="/bookkeeping/static/css/bookkeeping-page.css?v=1">
<link rel="stylesheet" href="/bookkeeping/static/css/bookkeeping-entry-sheet.css?v=1">
<link rel="stylesheet" href="/bookkeeping/static/css/bookkeeping-amount-pad.css?v=1">
</head>
<body>

<header>
  <div class="nav-row">
    <details class="nav-menu brand-menu" id="brand-menu">
      <summary>My Money<svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="menu">
        <a href="/bookkeeping/changelog">更新日志</a>
        <button type="button" class="logout-row" id="logout" title="退出登录">退出登录</button>
      </div>
    </details>
    <button type="button" id="refresh-btn" aria-label="立即同步"><svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><path d="M12 7a5 5 0 1 1-1.46-3.54" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 1.6v2.4H9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</header>

<div class="sync-strip" id="sync-strip">
  <span class="dot"></span><span id="sync-text">本地账本</span>
</div>

<main>
  <div class="month-bar">
    <button type="button" id="mon-prev" aria-label="上月">‹</button>
    <div class="mon" id="mon-label"></div>
    <button type="button" id="mon-next" aria-label="下月">›</button>
  </div>
  <div class="sum-row">
    <div class="sum-cell"><div class="k">支出</div><div class="v" id="sum-out">¥0</div></div>
    <div class="sum-cell"><div class="k">收入</div><div class="v in" id="sum-in">¥0</div></div>
  </div>
  <div class="person-row" id="person-row"></div>
  <div id="entry-list"></div>
  <div class="list-empty" id="list-empty" hidden>这个月还没有账目</div>
</main>

<button type="button" id="fab" aria-label="记一笔">＋</button>

<div id="sheet-mask" hidden></div>
<div id="sheet" hidden>
  <div class="grab-zone" id="grab-zone"><div class="grab"></div></div>
  <div class="sheet-head">
    <button type="button" class="head-btn" id="sheet-close">关闭</button>
    <h2 id="sheet-title">记一笔</h2>
    <button type="button" class="head-btn" id="sheet-del" hidden>删除</button>
  </div>
  <div class="seg" id="kind-seg">
    <button type="button" data-kind="expense" class="exp on">支出</button>
    <button type="button" data-kind="income" class="inc">收入</button>
  </div>
  <div class="amt-line" id="amt-line"><span class="cur">¥</span><input id="f-amount" type="text" inputmode="none" placeholder="0.00" autocomplete="off"><span class="amt-eq" id="amt-eq"></span></div>
  <div class="cat-tiles" id="cat-tiles"></div>
  <div class="row2">
    <div class="field"><span>日期</span><input id="f-date" type="date"></div>
    <div class="field"><span>时间</span><input id="f-time" type="time"></div>
    <div class="field"><span>备注</span><input type="text" id="f-note" maxlength="200" placeholder="选填" autocomplete="off"></div>
  </div>
  <div class="row2">
    <div class="field"><span>标签</span><input type="text" id="f-tags" maxlength="80" placeholder="空格分隔, 选填" autocomplete="off"></div>
  </div>
  <div class="tag-chips" id="tag-chips" hidden></div>
  <div class="amt-pad" id="amt-pad" role="group" aria-label="金额键盘">
    <button type="button" class="k" data-k="7">7</button><button type="button" class="k" data-k="8">8</button><button type="button" class="k" data-k="9">9</button><button type="button" class="k op" data-k="/">÷</button>
    <button type="button" class="k util" data-k="back">⌫</button>
    <button type="button" class="k" data-k="4">4</button><button type="button" class="k" data-k="5">5</button><button type="button" class="k" data-k="6">6</button><button type="button" class="k op" data-k="*">×</button>
    <button type="button" class="k" data-k="1">1</button><button type="button" class="k" data-k="2">2</button><button type="button" class="k" data-k="3">3</button><button type="button" class="k op" data-k="-">−</button>
    <button type="button" class="k done" data-k="done">完成</button>
    <button type="button" class="k zero" data-k="0">0</button><button type="button" class="k" data-k=".">.</button><button type="button" class="k op" data-k="+">＋</button>
  </div>
</div>

<script src="/static/menu-user.js?v=2"></script>
<script src="/bookkeeping/static/bookkeeping-merge.js?v=2"></script>
<script src="/bookkeeping/static/amount-calculator.js?v=1"></script>
<script src="/bookkeeping/static/bookkeeping-state.js?v=1"></script>
<script src="/bookkeeping/static/bookkeeping-render.js?v=1"></script>
<script src="/bookkeeping/static/bookkeeping-sync.js?v=1"></script>
<script src="/bookkeeping/static/bookkeeping-entry-sheet.js?v=1"></script>
<script src="/bookkeeping/static/bookkeeping-amount-pad.js?v=1"></script>
<script src="/bookkeeping/static/bookkeeping-boot.js?v=1"></script>
</body>
</html>
