<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="/bookkeeping/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/bookkeeping/static/favicon.svg">
<link rel="apple-touch-icon" href="/bookkeeping/static/apple-touch-icon.png?v=3">
<link rel="manifest" href="/bookkeeping/static/manifest.json">
<title>更新日志 · My Money</title>
<link rel="stylesheet" href="/bookkeeping/static/css/bookkeeping-changelog.css?v=1">
</head>
<body data-changelog-api="/bookkeeping/changelog/api/entries">

<header>
  <div class="nav-row">
    <details class="nav-menu brand-menu" id="brand-menu">
      <summary>My Money<svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="menu">
        <a href="/bookkeeping/">记账</a>
        <a class="on" href="/bookkeeping/changelog">更新日志</a>
        <button class="logout-row" id="logout" title="退出登录">退出登录</button>
      </div>
    </details>
    <button id="refresh-btn" aria-label="刷新日志"><svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><path d="M12 7a5 5 0 1 1-1.46-3.54" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 1.6v2.4H9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</header>

<main>
    <div id="entries">
    <div id="list"></div>
    <div class="state" id="loading"><div class="spin"></div>正在读取版本历史…</div>
    <div class="state" id="error" hidden>
      <div id="error-text">加载失败</div>
      <button class="retry-btn" id="retry">重试</button>
    </div>
  </div>
</main>

<script src="/static/menu-user.js?v=2"></script>
<script src="/static/changelog-page.js?v=1"></script>
</body>
</html>
