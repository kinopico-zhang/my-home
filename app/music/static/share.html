<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/music/static/favicon.svg">
<!--og-->
<title>分享 · My Music</title>
<style>
  /* 公开分享页: 自包含 (不引应用 JS —— 访客没有会话; 歌词解析是纯模块,
     从公开的 /music/static 借用), 深色基调与应用一致 */
  :root {
    color-scheme: dark;
    --bg: #000;
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --surface-3: #3a3a3c;
    --ink-1: #f5f5f7;
    --ink-2: rgba(235,235,245,.62);
    --ink-3: rgba(235,235,245,.32);
    --hairline: rgba(255,255,255,.09);
    --accent: #fa2d48;
  }
  /* app 思路: 全程不画滚动条 (手机本来就不画, 电脑上也干净) —— 能滚, 只是不显示 */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent;
      scrollbar-width: none; }
  ::-webkit-scrollbar { display: none; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
  body {
    background: var(--bg); color: var(--ink-1);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
                 "Helvetica Neue", system-ui, sans-serif;
    font-size: 14px; line-height: 1.45;
    min-height: 100vh; min-height: 100dvh;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }

  .share-mark {
    margin: 20px 0 4px; text-align: center;
    font-size: 13px; font-weight: 700; letter-spacing: .4px; color: var(--accent);
  }
  main { max-width: 520px; margin: 0 auto;
         padding: 8px 20px calc(110px + env(safe-area-inset-bottom)); }

  /* ---------- 失效态 ---------- */
  #share-error { padding: 96px 24px 0; text-align: center; color: var(--ink-2); }
  #share-error svg { color: var(--ink-3); margin-bottom: 16px; }
  #share-error h1 { font-size: 17px; font-weight: 600; color: var(--ink-1); }
  #share-error p { font-size: 13px; margin-top: 6px; color: var(--ink-3); }

  /* ---------- 卡片 ---------- */
  #share-card { text-align: center; padding-top: 18px; }
  .hero-art {
    width: min(52vw, 208px); aspect-ratio: 1; margin: 0 auto;
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 18px 40px rgba(0,0,0,.55);
    background: var(--surface-2);
  }
  .hero-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-art.ph {          /* 没有封面: 渐变音符块 (与列表无封面占位同一语言) */
    background: linear-gradient(135deg, #48484c, #232326);
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.5); font-size: 64px; font-weight: 700;
  }
  #share-title { font-size: 20px; font-weight: 700; margin-top: 18px;
                 overflow-wrap: anywhere; }
  #share-subtitle { font-size: 14px; color: var(--ink-2); margin-top: 4px;
                    overflow-wrap: anywhere; }
  #hero-play {
    width: 54px; height: 54px; border-radius: 50%; border: 0; cursor: pointer;
    margin-top: 16px; background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
  }
  #hero-play:active { transform: scale(.94); }
  #hero-play.off { background: var(--surface-3); pointer-events: none; }
  #hero-play svg { width: 22px; height: 22px; }

  /* ---------- 曲目清单 ---------- */
  .list-head { margin-top: 26px; text-align: left;
               font-size: 12px; color: var(--ink-3); }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--hairline);
    cursor: pointer; text-align: left; width: 100%; background: none; border: 0;
    border-bottom: 1px solid var(--hairline); color: inherit; font: inherit;
  }
  .row:last-child { border-bottom: 0; }
  .row .lead { width: 22px; flex-shrink: 0; text-align: center;
               color: var(--ink-3); font-size: 13px;
               font-variant-numeric: tabular-nums; }
  .row .lead i { font-style: normal; }
  .row .txt { flex: 1; min-width: 0; }
  .row .t { font-size: 15px; overflow: hidden; white-space: nowrap;
            text-overflow: ellipsis; }
  .row .a { font-size: 12px; color: var(--ink-2); margin-top: 1px;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row .dur { color: var(--ink-3); font-size: 12px; flex-shrink: 0;
              font-variant-numeric: tabular-nums; }
  .row.on .t { color: var(--accent); }
  .row.na { opacity: .45; pointer-events: none; }
  .bars { width: 14px; height: 14px; fill: var(--accent); }
  .bars rect { transform-origin: center 11px; animation: eq 1s ease-in-out infinite; }
  .bars rect:nth-child(2) { animation-delay: .25s; }
  .bars rect:nth-child(3) { animation-delay: .5s; }
  .bars.paused rect { animation-play-state: paused; }
  @keyframes eq { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { .bars rect { animation: none; } }

  .expire { margin-top: 26px; font-size: 12px; color: var(--ink-3); }

  /* ---------- 底部迷你条 ---------- */
  #player {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(10,10,12,.82);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    padding: 4px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .p-seek { display: flex; align-items: center; gap: 8px; }
  .p-seek span { width: 38px; font-size: 11px; color: var(--ink-3);
                 font-variant-numeric: tabular-nums; }
  .p-seek span:last-child { text-align: right; }
  #seek {
    -webkit-appearance: none; appearance: none; flex: 1; height: 26px;
    background: transparent; cursor: pointer;
  }
  #seek::-webkit-slider-runnable-track { height: 4px; border-radius: 2px;
                                         background: var(--surface-3); }
  #seek::-webkit-slider-thumb { -webkit-appearance: none; width: 14px;
                                height: 14px; border-radius: 50%; background: #fff;
                                margin-top: -5px; }
  #seek::-moz-range-track { height: 4px; border-radius: 2px;
                            background: var(--surface-3); }
  #seek::-moz-range-thumb { width: 14px; height: 14px; border: 0;
                            border-radius: 50%; background: #fff; }
  .p-main { display: flex; align-items: center; gap: 12px; margin-top: 2px; }
  .p-art { width: 42px; height: 42px; border-radius: 8px; overflow: hidden;
           flex-shrink: 0; background: var(--surface-2);
           display: flex; align-items: center; justify-content: center;
           color: rgba(255,255,255,.5); font-size: 20px; font-weight: 700; }
  .p-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .p-text { flex: 1; min-width: 0; cursor: pointer; }
  .p-text b { display: block; font-size: 14px; font-weight: 600;
              overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .p-text span { display: block; font-size: 12px; color: var(--ink-2);
                 overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #p-toggle {
    width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer;
    background: #fff; color: #000; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #p-toggle:active { transform: scale(.94); }
  #p-toggle svg { width: 17px; height: 17px; }

  /* ---------- 全屏播放页 (与应用同款骨架: 封面/歌词 共住一块,
     点封面切歌词; 传输三键站进度条上方) ---------- */
  #fp {
    position: fixed; inset: 0; z-index: 40; background: #000;
    transform: translateY(100%); transition: transform .32s cubic-bezier(.32,.72,0,1);
  }
  #fp.open { transform: none; }
  .fp-bg { position: absolute; inset: -60px; overflow: hidden; }
  .fp-bg img { width: 100%; height: 100%; object-fit: cover;
               filter: blur(70px) brightness(.45) saturate(1.3); }
  .fp-bg.ph { background: linear-gradient(160deg, #2c2c2e, #000); }
  .fp-sheet {
    position: relative; height: 100%; max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column;
  }
  #fp-grab {                 /* 抓手条: 点一下收起 */
    display: flex; justify-content: center; align-items: flex-start;
    padding: calc(env(safe-area-inset-top, 0px) + 3px) 0 0;
    border: 0; background: none; cursor: pointer;
  }
  #fp-grab div { width: 60px; height: 5px; border-radius: 2.5px;
                 background: rgba(255,255,255,.5); }
  .fp-body {
    position: relative; flex: 1; min-height: 120px;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 24px 28px;
  }
  #fp-art-wrap { width: 100%; aspect-ratio: 1; max-height: 100%;
                 max-width: min(100%, 440px); touch-action: none; cursor: pointer; }
  /* 封面不许原生拖拽/长按呼出 (不然下拉手势被 dragstart 劫持) */
  #fp-art-wrap, #fp-art { -webkit-user-drag: none; user-select: none;
                          -webkit-touch-callout: none; }
  #fp-art { width: 100%; height: 100%; object-fit: cover; border-radius: 8px;
            background: rgba(255,255,255,.08);
            box-shadow: 0 18px 50px rgba(0,0,0,.55); }
  #fp-lyrics {
    position: absolute; inset: 0; overflow-y: auto; z-index: 2;
    -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
    mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
    padding: 30% 28px; cursor: pointer;
  }
  .lyrics-line {
    font-size: 21px; font-weight: 700; color: rgba(255,255,255,.32);
    padding: 12px 0; line-height: 1.34; text-align: left;
    filter: blur(3px); will-change: filter;
    transition: filter .5s cubic-bezier(.22,.61,.36,1),
                color .5s cubic-bezier(.22,.61,.36,1),
                font-size .5s cubic-bezier(.22,.61,.36,1);
  }
  /* 距离模糊: 近一两句半模糊, 正在唱的全清放大 (与应用同一套) */
  .lyrics-line.near-2 { filter: blur(2px); }
  .lyrics-line.near-1 { filter: blur(1px); }
  .lyrics-line.active { color: #fff; font-size: 26px; filter: blur(0); }
  /* 纯文本歌词没有"当前句", 整页清晰 */
  #fp-lyrics.static .lyrics-line { filter: blur(0); }
  .lyrics-empty { position: absolute; inset: 0; display: flex; align-items: center;
                  justify-content: center; color: var(--ink-3); font-size: 15px; }
  .fp-meta { display: flex; align-items: center; padding: 0 32px; }
  .fp-meta b { display: block; font-size: 19px; font-weight: 700; color: #fff;
               overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .fp-meta small { display: block; font-size: 12px; color: rgba(255,255,255,.62);
                   margin-top: 2px; overflow: hidden; white-space: nowrap;
                   text-overflow: ellipsis; }
  .fp-controls { display: flex; align-items: center; justify-content: center;
                 gap: 32px; margin-top: 14px; }
  .fp-controls > button {
    width: 44px; height: 44px; color: #fff; padding: 0; border: 0;
    background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .16s ease, opacity .16s ease;
  }
  .fp-controls > button:active { transform: scale(.86); opacity: .75; }
  .fp-controls > button:disabled { opacity: .3; pointer-events: none; }
  .fp-transport { display: flex; align-items: center; gap: 10px;
                  margin-top: 10px; padding: 0 24px; }
  .fp-time { flex-shrink: 0; font-size: 10px; color: rgba(255,255,255,.5);
             font-variant-numeric: tabular-nums; }
  .fp-scrub { flex: 1; min-width: 0; }
  #fp-scrub {
    -webkit-appearance: none; appearance: none; width: 100%; height: 26px;
    background: transparent; cursor: pointer;
  }
  #fp-scrub::-webkit-slider-runnable-track { height: 4px; border-radius: 2px;
                                             background: var(--surface-3); }
  #fp-scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 14px;
                                    height: 14px; border-radius: 50%;
                                    background: #fff; margin-top: -5px; }
  #fp-scrub::-moz-range-track { height: 4px; border-radius: 2px;
                                background: var(--surface-3); }
  #fp-scrub::-moz-range-thumb { width: 14px; height: 14px; border: 0;
                                border-radius: 50%; background: #fff; }
  .fp-pad { height: calc(28px + env(safe-area-inset-bottom, 0px)); }
</style>
</head>
<body>

<div class="share-mark"><a href="/music">♪ My Music</a></div>
<main>
  <section id="share-error" hidden>
    <svg viewBox="0 0 24 24" width="44" height="44" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <path d="M9 17H7A5 5 0 1 1 7 7h2M15 7h2a5 5 0 1 1 0 10h-2M8 12h3M13.5 12h2.5"/>
    </svg>
    <h1>链接不存在或已过期</h1>
    <p>分享链接在创建 24 小时后失效</p>
  </section>

  <section id="share-card" hidden>
    <div class="hero-art" id="hero-art" aria-hidden="true"></div>
    <h1 id="share-title"></h1>
    <p id="share-subtitle"></p>
    <button id="hero-play" aria-label="播放">
      <svg id="ic-play" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8.2 5.1c0-1.2 1.3-1.9 2.3-1.3l10.1 6.4c1 .6 1 2 0 2.6L10.5 19.2c-1 .6-2.3-.1-2.3-1.3V5.1z" fill="currentColor"/>
      </svg>
      <svg id="ic-pause" viewBox="0 0 24 24" hidden aria-hidden="true">
        <rect x="6" y="4.5" width="4.4" height="15" rx="2.2" fill="currentColor"/>
        <rect x="13.6" y="4.5" width="4.4" height="15" rx="2.2" fill="currentColor"/>
      </svg>
    </button>
    <div class="list-head" id="list-head" hidden></div>
    <div id="share-list"></div>
    <p class="expire" id="share-expire"></p>
  </section>
</main>

<div id="player" hidden>
  <div class="p-seek">
    <span id="t-now">0:00</span>
    <input id="seek" type="range" min="0" max="1000" step="1" value="0"
           aria-label="播放进度">
    <span id="t-total">-:--</span>
  </div>
  <div class="p-main">
    <div class="p-art" id="p-art" aria-hidden="true"></div>
    <div class="p-text" id="p-text"><b id="p-title"></b><span id="p-artist"></span></div>
    <button id="p-toggle" aria-label="播放/暂停">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="use-play" d="M8.2 5.1c0-1.2 1.3-1.9 2.3-1.3l10.1 6.4c1 .6 1 2 0 2.6L10.5 19.2c-1 .6-2.3-.1-2.3-1.3V5.1z" fill="currentColor"/>
        <g class="use-pause">
          <rect x="6" y="4.5" width="4.4" height="15" rx="2.2" fill="currentColor"/>
          <rect x="13.6" y="4.5" width="4.4" height="15" rx="2.2" fill="currentColor"/>
        </g>
      </svg>
    </button>
  </div>
</div>

<div id="fp" hidden>
  <div class="fp-bg ph" id="fp-bg" aria-hidden="true"><img id="fp-bg-img" alt=""></div>
  <div class="fp-sheet">
    <button id="fp-grab" aria-label="收起播放页"><div></div></button>
    <div class="fp-body">
      <div id="fp-art-wrap"><img id="fp-art" alt=""></div>
      <div id="fp-lyrics" hidden></div>
    </div>
    <div class="fp-meta"><b id="fp-title"></b><small id="fp-artist"></small></div>
    <div class="fp-controls">
      <button id="fp-prev" aria-label="上一首"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M21.981 6.098L14.6 10.949Q13 12 14.6 13.051L21.981 17.902Q23.5 18.9 23.5 17.082L23.5 6.918Q23.5 5.1 21.981 6.098M9.481 6.098L2.1 10.949Q0.5 12 2.1 13.051L9.481 17.902Q11 18.9 11 17.082L11 6.918Q11 5.1 9.481 6.098" fill="currentColor"/></svg></button>
      <button id="fp-play" aria-label="播放/暂停"></button>
      <button id="fp-next" aria-label="下一首"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M2.019 6.098L9.4 10.949Q11 12 9.4 13.051L2.019 17.902Q0.5 18.9 0.5 17.082L0.5 6.918Q0.5 5.1 2.019 6.098zM14.519 6.098L21.9 10.949Q23.5 12 21.9 13.051L14.519 17.902Q13 18.9 13 17.082L13 6.918Q13 5.1 14.519 6.098z" fill="currentColor"/></svg></button>
    </div>
    <div class="fp-transport">
      <span class="fp-time" id="fp-time-cur">-0:00</span>
      <div class="fp-scrub"><input id="fp-scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="进度"></div>
      <span class="fp-time" id="fp-time-total">-0:00</span>
    </div>
    <div class="fp-pad"></div>
  </div>
</div>

<audio id="audio" playsinline></audio>

<script src="/music/static/lyrics-parser.js"></script>
<script>
"use strict";
// 分享页逻辑: 拿 uuid 换数据 → 渲染 → 流地址播放; 失效 (410) 走错误态。
// 迷你条点文字区掀全屏播放页 (与应用同款骨架: 封面点一下切歌词,
// 传输三键 上一首/播放/下一首 站进度条上方); 歌词解析借应用公开的
// lyrics-parser.js (纯模块, 不带会话)。一切状态以 <audio> 的
// play/pause 事件为准, 按钮只改 audio。

const $ = (sel) => document.querySelector(sel);
const esc = (value) => String(value).replace(/[&<>"']/g, (ch) => (
  {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[ch]));

const PATH_PARTS = location.pathname.split("/");   // ["", "music", "share", token]
const token = PATH_PARTS.length > 3 ? PATH_PARTS[3] : "";

const ICON_PLAY_BIG = '<svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M5.029 3.127L19 10.889Q21 12 19 13.111L5.029 20.873Q3 22 3 19.679L3 4.321Q3 2 5.029 3.127z" fill="currentColor"/></svg>';
const ICON_PAUSE_BIG = '<svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M4 4.5q0-2.5 2.5-2.5t2.5 2.5v15q0 2.5-2.5 2.5t-2.5-2.5v-15zM15 4.5q0-2.5 2.5-2.5t2.5 2.5v15q0 2.5-2.5 2.5t-2.5-2.5v-15z" fill="currentColor"/></svg>';

const audio = $("#audio");
let queue = [];            // 可播的曲目 (按分享里的顺序)
let queuePos = -1;         // 正在播的下标
let seeking = false;
let lyrics = null;         // 当前曲的 {synced, lines} | null (没歌词)
let lyricsCache = new Map();     // track_id → 解析结果 (null = 没歌词)
let lyricIndex = -1;       // 正在唱的行
let lyricsViewOpen = false;
let lyricsFollowPaused = false;  // 手动滚过: 暂停跟唱
let lyricsLastScrollAt = 0;
let lyricsAutoUntil = 0;   // 程序滚动宽限期 (这期间的 scroll 不算手动)
let pullSuppressClick = false;   // 下拉收起拖过了: 松手的尾随 click 不切歌词

const BARS_SVG = '<svg class="bars paused" viewBox="0 0 14 14" aria-hidden="true">'
  + '<rect x="1" y="2" width="2.6" height="10" rx="1.3"/>'
  + '<rect x="5.7" y="2" width="2.6" height="10" rx="1.3"/>'
  + '<rect x="10.4" y="2" width="2.6" height="10" rx="1.3"/></svg>';

function fmtTime(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) return "-:--";
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}

function fmtDateTime(epochSeconds) {
  const d = new Date(epochSeconds * 1000);
  const two = (n) => String(n).padStart(2, "0");
  return `${d.getMonth() + 1}月${d.getDate()}日 `
    + `${two(d.getHours())}:${two(d.getMinutes())}`;
}

// 封面: 这一首自己的 → 它的专辑的 → 渐变占位 (onerror 兜底)
function artURL(track) {
  if (track.has_artwork) {
    return `/music/share/${token}/artwork/track/${track.track_id}?v=${track.mtime}`;
  }
  return `/music/share/${token}/artwork/album/${track.album_id}`;
}

function setArt(el, url) {
  el.classList.remove("ph");
  el.textContent = "";
  const img = document.createElement("img");
  img.alt = "";
  img.decoding = "async";
  img.onerror = () => {
    el.classList.add("ph");
    el.textContent = "♪";
    img.remove();
  };
  img.src = url;
  el.appendChild(img);
}

function setPlaceholder(el) {
  el.classList.add("ph");
  el.textContent = "♪";
}

async function boot() {
  if (!token) return showError();
  let data = null;
  try {
    const resp = await fetch(`/music/share/${token}/api`,
                             {cache: "no-store"});
    if (!resp.ok) return showError();          // 410 / 404 → 失效态
    data = await resp.json();
  } catch {
    return showError();
  }
  render(data);
}

function showError() {
  $("#share-error").hidden = false;
}

function render(data) {
  document.title = `${data.title} · My Music`;
  $("#share-title").textContent = data.title;
  $("#share-subtitle").textContent = data.subtitle;
  $("#share-expire").textContent = `链接有效期至 ${fmtDateTime(data.expires_at)}`;

  const heroArt = $("#hero-art");
  if (data.kind === "playlist" && data.playlist) {
    if (data.playlist.cover_version > 0) {
      setArt(heroArt, `/music/share/${token}/artwork/playlist/`
             + `${data.playlist.playlist_id}?v=${data.playlist.cover_version}`);
    } else {
      setPlaceholder(heroArt);
    }
  } else if (data.tracks.length > 0) {
    setArt(heroArt, artURL(data.tracks[0]));
  } else {
    setPlaceholder(heroArt);
  }

  queue = data.tracks.filter((t) => t.playable);
  if (data.kind === "playlist") {
    $("#list-head").hidden = false;
    $("#list-head").textContent = `${data.tracks.length} 首歌曲`;
    $("#share-list").innerHTML = data.tracks.map((t, i) => (
      `<div class="row${t.playable ? "" : " na"}" data-track-id="${t.track_id}">`
      + `<span class="lead"><i class="num">${i + 1}</i></span>`
      + `<span class="txt"><span class="t">${esc(t.title)}</span>`
      + `<span class="a">${esc(t.artist)}</span></span>`
      + `<span class="dur">${fmtTime(t.duration_seconds)}</span></div>`
    )).join("");
  }
  // 单曲分享没有上一首/下一首可言, 传输区收成一颗播放键
  if (queue.length < 2) {
    $("#fp-prev").hidden = true;
    $("#fp-next").hidden = true;
  }
  if (queue.length === 0) $("#hero-play").classList.add("off");
  $("#share-card").hidden = false;
}

function playQueue(pos) {
  if (pos < 0 || pos >= queue.length) return;
  queuePos = pos;
  const track = queue[pos];
  audio.src = `/music/share/${token}/stream/${track.track_id}`;
  for (const input of [$("#seek"), $("#fp-scrub")]) input.value = "0";
  $("#t-now").textContent = "0:00";
  $("#t-total").textContent = "-:--";
  $("#fp-time-cur").textContent = "-0:00";
  $("#fp-time-total").textContent = "-0:00";
  $("#player").hidden = false;
  $("#p-title").textContent = track.title;
  $("#p-artist").textContent = track.artist;
  setArt($("#p-art"), artURL(track));
  // 全屏页: 曲名/封面/毛玻璃底/传输可用态 一起跟上
  $("#fp-title").textContent = track.title;
  $("#fp-artist").textContent = track.artist;
  setArt($("#fp-art"), artURL(track));
  const bgImg = $("#fp-bg-img");
  bgImg.onerror = () => { $("#fp-bg").classList.add("ph"); bgImg.removeAttribute("src"); };
  if (bgImg.getAttribute("src") !== artURL(track)) {
    $("#fp-bg").classList.remove("ph");
    bgImg.src = artURL(track);
  }
  $("#fp-prev").disabled = queuePos <= 0;
  $("#fp-next").disabled = queuePos >= queue.length - 1;
  document.title = `${track.title} · My Music`;
  loadLyrics(track);
  updateMediaSession(track);
  updateIcons();     // 自动播放被浏览器拦住时 play 事件不来, 键态先就位
  document.querySelectorAll(".row").forEach((row) => {
    const on = Number(row.dataset.trackId) === track.track_id;
    row.classList.toggle("on", on);
    const lead = row.querySelector(".lead");
    if (on) {
      lead.innerHTML = BARS_SVG;
    } else {
      const idx = Array.prototype.indexOf.call(row.parentNode.children, row);
      lead.innerHTML = `<i class="num">${idx + 1}</i>`;
    }
  });
  audio.play().catch(() => {});
}

function togglePlay() {
  if (audio.paused) {
    if (!audio.src) return playQueue(0);
    audio.play().catch(() => {});
  } else {
    audio.pause();
  }
}

function prevTrack() {
  if (queuePos > 0) playQueue(queuePos - 1);
}

function nextTrack() {
  if (queuePos + 1 < queue.length) playQueue(queuePos + 1);
}

function updateIcons() {
  const playing = !audio.paused;
  $("#ic-play").hidden = playing;
  $("#ic-pause").hidden = !playing;
  const toggleSvg = $("#p-toggle svg");
  toggleSvg.querySelector(".use-play").style.display = playing ? "none" : "";
  toggleSvg.querySelector(".use-pause").style.display = playing ? "" : "none";
  $("#fp-play").innerHTML = playing ? ICON_PAUSE_BIG : ICON_PLAY_BIG;
  const bars = document.querySelector(".row .bars");
  if (bars) bars.classList.toggle("paused", audio.paused);
}

// 锁屏/控制中心 (支持的浏览器才有; 微信内建浏览器没有也不碍事)
function updateMediaSession(track) {
  if (!("mediaSession" in navigator) || typeof MediaMetadata === "undefined") return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title, artist: track.artist, album: "My Music",
      artwork: [{ src: new URL(artURL(track), location.href).href,
                  sizes: "512x512", type: "image/jpeg" }],
    });
    navigator.mediaSession.setActionHandler("play", () => audio.play().catch(() => {}));
    navigator.mediaSession.setActionHandler("pause", () => audio.pause());
    if (queue.length > 1) {
      navigator.mediaSession.setActionHandler("previoustrack", prevTrack);
      navigator.mediaSession.setActionHandler("nexttrack", nextTrack);
    }
  } catch { /* 老浏览器 setActionHandler 会抛, 不值得为它炸页面 */ }
}

// ------------------------------------------------------------ 全屏播放页

function openFullPlayer() {
  const fp = $("#fp");
  if (!fp.hidden) return;
  fp.hidden = false;
  void fp.offsetWidth;    // 起点样式落地再放滑入
  fp.classList.add("open");
}

function closeFullPlayer() {
  const fp = $("#fp");
  if (fp.hidden) return;
  fp.classList.remove("open");
  setTimeout(() => { fp.hidden = true; }, 340);
}

// 封面点一下 ↔ 歌词; 拖动 (下拉) 不算点
function toggleLyricsView() {
  lyricsViewOpen = !lyricsViewOpen;
  $("#fp-lyrics").hidden = !lyricsViewOpen;
  $("#fp-art-wrap").hidden = lyricsViewOpen;
  if (lyricsViewOpen) syncLyricHighlight(true);
}

// 下拉收起: 封面区跟手下移, 松手过 90px 或带甩劲就收; 横移/上移撒手
(function bindPullClose() {
  const art = $("#fp-art-wrap");
  const fp = $("#fp");
  let drag = null;
  art.addEventListener("pointerdown", (event) => {
    if (event.pointerType === "mouse" && event.button !== 0) return;
    drag = { startX: event.clientX, startY: event.clientY,
             lastY: event.clientY, lastT: event.timeStamp,
             y: 0, decided: false };
  });
  art.addEventListener("pointermove", (event) => {
    if (!drag) return;
    const dx = event.clientX - drag.startX;
    const dy = event.clientY - drag.startY;
    if (!drag.decided) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      drag.decided = true;
      if (!(dy > 0 && dy > Math.abs(dx))) { drag = null; return; }  // 只收下拉
      pullSuppressClick = true;
      try { art.setPointerCapture(event.pointerId); } catch { /* 照拖 */ }
      fp.style.transition = "none";
    }
    drag.y = Math.max(0, dy);
    drag.lastY = event.clientY;
    drag.lastT = event.timeStamp;
    fp.style.transform = `translateY(${drag.y}px)`;
  });
  const finish = (event, cancelled) => {
    if (!drag) return;
    const d = drag;
    drag = null;
    if (!d.decided) return;
    fp.style.transition = "";
    fp.style.transform = "";
    if (cancelled) return;                     // 浏览器接管: 弹回原位
    const flick = event.timeStamp - d.lastT < 100 && d.lastY - d.startY > 40;
    if (d.y > 90 || flick) closeFullPlayer();
  };
  art.addEventListener("pointerup", (event) => finish(event, false));
  art.addEventListener("pointercancel", () => finish(null, true));
  art.addEventListener("click", () => {
    if (pullSuppressClick) { pullSuppressClick = false; return; }
    toggleLyricsView();
  });
})();

$("#fp-lyrics").addEventListener("click", toggleLyricsView);
$("#fp-grab").addEventListener("click", closeFullPlayer);
$("#p-text").addEventListener("click", openFullPlayer);
$("#fp-prev").addEventListener("click", prevTrack);
$("#fp-next").addEventListener("click", nextTrack);
$("#fp-play").addEventListener("click", togglePlay);

// ------------------------------------------------------------ 歌词

/** 换曲铺词: 先空态, 取回来 (404 = 没词) 再铺; 换得快就听最后那首的。 */
async function loadLyrics(track) {
  lyrics = null;
  lyricIndex = -1;
  lyricsFollowPaused = false;
  renderLyricsView();
  if (lyricsCache.has(track.track_id)) {
    lyrics = lyricsCache.get(track.track_id);
    renderLyricsView();
    return;
  }
  let parsed = null;
  try {
    const resp = await fetch(`/music/share/${token}/lyrics/${track.track_id}`,
                             {cache: "no-store"});
    if (resp.ok) parsed = parseLyrics((await resp.json()).lyrics);
  } catch { /* 网络挂了当没词 */ }
  lyricsCache.set(track.track_id, parsed);
  const current = queue[queuePos];
  if (!current || current.track_id !== track.track_id) return;   // 已经换曲了
  lyrics = parsed;
  renderLyricsView();
}

function renderLyricsView() {
  const box = $("#fp-lyrics");
  box.classList.toggle("static", !lyrics || !lyrics.synced);
  if (!lyrics) {
    box.innerHTML = '<div class="lyrics-empty">没有歌词</div>';
    return;
  }
  box.innerHTML = lyrics.lines.map(
    (line) => `<p class="lyrics-line">${esc(line.text)}</p>`).join("");
  syncLyricHighlight(true);
}

/** 高亮跟到当前句 (含近邻模糊分级), 顺带把当前句滚到视线中央。 */
function syncLyricHighlight(force) {
  if (!lyrics || !lyrics.synced) return;
  const index = activeLyricIndex(lyrics.lines, audio.currentTime);
  if (index === lyricIndex && !force) return;
  lyricIndex = index;
  const lines = $("#fp-lyrics").querySelectorAll(".lyrics-line");
  lines.forEach((line, i) => {
    line.classList.toggle("active", i === index);
    line.classList.toggle("near-1", Math.abs(i - index) === 1);
    line.classList.toggle("near-2", Math.abs(i - index) === 2);
  });
  if (index >= 0 && lines[index] && !lyricsFollowPaused) {
    scrollLyricsTo(lines[index]);
  }
}

function scrollLyricsTo(line) {
  const box = $("#fp-lyrics");
  lyricsAutoUntil = Date.now() + 900;   // smooth 滚动期间的 scroll 不算手动
  box.scrollTo({ top: line.offsetTop - box.clientHeight / 2
                         + line.offsetHeight / 2,
                 behavior: "smooth" });
}

// 手动滚词: 暂停跟唱, 静置 4 秒自动回去 (应用同款节奏)
$("#fp-lyrics").addEventListener("scroll", () => {
  if (Date.now() < lyricsAutoUntil) return;
  lyricsFollowPaused = true;
  lyricsLastScrollAt = Date.now();
});
setInterval(() => {
  if (lyricsFollowPaused && Date.now() - lyricsLastScrollAt > 4000) {
    lyricsFollowPaused = false;
    syncLyricHighlight(true);
  }
}, 600);

// ------------------------------------------------------------ 音频事件

$("#hero-play").addEventListener("click", togglePlay);
$("#p-toggle").addEventListener("click", togglePlay);

$("#share-list").addEventListener("click", (event) => {
  const row = event.target.closest(".row");
  if (!row || row.classList.contains("na")) return;
  const trackId = Number(row.dataset.trackId);
  const pos = queue.findIndex((t) => t.track_id === trackId);
  if (pos >= 0) playQueue(pos);
});

audio.addEventListener("play", updateIcons);
audio.addEventListener("pause", updateIcons);
audio.addEventListener("loadedmetadata", () => {
  $("#t-total").textContent = fmtTime(audio.duration);
  $("#fp-time-total").textContent = `-${fmtTime(audio.duration)}`;
});
audio.addEventListener("timeupdate", () => {
  const duration = Number.isFinite(audio.duration) ? audio.duration : 0;
  if (!seeking && duration > 0) {
    const value = String(Math.round(audio.currentTime / duration * 1000));
    $("#seek").value = value;
    $("#fp-scrub").value = value;
  }
  $("#t-now").textContent = fmtTime(audio.currentTime);
  $("#fp-time-cur").textContent = `-${fmtTime(audio.currentTime)}`;
  $("#fp-time-total").textContent = `-${fmtTime(Math.max(0, duration - audio.currentTime))}`;
  syncLyricHighlight(false);
});
audio.addEventListener("ended", () => {
  if (queuePos + 1 < queue.length) playQueue(queuePos + 1);
});
audio.addEventListener("error", () => {
  $("#p-title").textContent = "播放失败";
  $("#p-artist").textContent = "";
});

// 拖进度 (迷你条/全屏页同一套): input 里只做标记 + 标签跟随, 真正 seek
// 落在 change (iOS 拖完才发); metadata 没到时 iOS 会拒 currentTime,
// try/catch 吞掉等 loadedmetadata。
function bindSeek(input) {
  input.addEventListener("input", () => {
    seeking = true;
    if (Number.isFinite(audio.duration) && audio.duration > 0) {
      const at = Number(input.value) / 1000 * audio.duration;
      $("#t-now").textContent = fmtTime(at);
      $("#fp-time-cur").textContent = `-${fmtTime(at)}`;
    }
  });
  input.addEventListener("change", () => {
    if (Number.isFinite(audio.duration) && audio.duration > 0) {
      try {
        audio.currentTime = Number(input.value) / 1000 * audio.duration;
      } catch { /* iOS 换源瞬间还没 metadata */ }
    }
    seeking = false;
  });
}
bindSeek($("#seek"));
bindSeek($("#fp-scrub"));

boot();
</script>
</body>
