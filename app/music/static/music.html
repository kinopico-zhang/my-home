<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Music">
<link rel="icon" type="image/png" sizes="32x32" href="/music/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/music/static/favicon.svg">
<link rel="apple-touch-icon" href="/music/static/apple-touch-icon.png?v=2">
<link rel="manifest" href="/music/static/manifest.json">
<title>My Music</title>
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --surface: #1c1c1e;
  --surface-2: #2c2c2e;
  --surface-3: #3a3a3c;
  --ink-1: #f5f5f7;
  --ink-2: rgba(235,235,245,.62);
  --ink-3: rgba(235,235,245,.32);
  --hairline: rgba(255,255,255,.09);
  --nav-bg: rgba(10,10,12,.72);
  --accent: #fa2d48;          /* Apple Music 红 */
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink-1);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
               "Helvetica Neue", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45;
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button, a, summary { touch-action: manipulation; }
img { display: block; }

/* ---------- 顶部导航 (毛玻璃, 与全站一致) ---------- */
header {
  padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background: var(--nav-bg);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--hairline);
  z-index: 50; position: sticky; top: 0;
}
.nav-row { display: flex; align-items: center; gap: 8px; max-width: 860px; margin: 0 auto; }
.nav-row > * { flex-shrink: 0; }
#back-btn {
  display: flex; align-items: center; gap: 2px; font-size: 15px;
  color: var(--accent); padding: 2px 6px 2px 0; margin-left: -6px;
}
#back-btn:active { opacity: .6; }
.brand-menu { position: relative; }
.brand-menu summary {
  display: flex; align-items: center; gap: 5px;
  font-size: 20px; font-weight: 700; letter-spacing: -.3px;
  list-style: none; -webkit-user-select: none; user-select: none;
  padding: 2px 8px 2px 0; border-radius: 8px;
}
.brand-menu summary::-webkit-details-marker { display: none; }
.brand-menu summary:active { opacity: .6; }
.brand-menu .chev { color: var(--ink-3); }
.brand-menu .menu {
  position: absolute; top: calc(100% + 8px); left: 0; min-width: 148px; z-index: 60;
  display: flex; flex-direction: column; padding: 5px;
  background: rgba(44,44,46,.92);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--hairline); border-radius: 14px;
  box-shadow: 0 12px 32px rgba(0,0,0,.5);
}
.brand-menu .menu button, .brand-menu .menu a {
  font-size: 14px; color: var(--ink-1); text-align: left;
  padding: 9px 12px; border-radius: 10px; white-space: nowrap;
}
.brand-menu .menu button:active, .brand-menu .menu a:active { background: var(--surface-3); }
.brand-menu .menu a { text-decoration: none; }
.brand-menu .menu .logout-row {
  color: #e5484d; border-top: 1px solid var(--hairline); margin-top: 5px;
  border-radius: 0 0 10px 10px;
}
#search-btn {
  display: flex; align-items: center; margin-left: auto;
  color: var(--ink-1); background: var(--surface-2);
  padding: 5px 10px; border-radius: 999px;
}
#search-btn:active { background: var(--surface-3); }

/* ---------- 主页/资料库页签 (header 第二行, 只在两个根视图亮) ---------- */
#view-tabs { max-width: 860px; margin: 9px auto 0; display: flex; justify-content: center; }
.vt-track { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 2px; }
.vt-track button {
  min-width: 110px; padding: 5px 18px; border-radius: 7px;
  font-size: 13px; font-weight: 500; color: var(--ink-2);
}
.vt-track button.on { background: var(--surface-3); color: var(--ink-1); font-weight: 600; }

/* ---------- 扫描进度条 ---------- */
#scan-strip {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 16px; font-size: 12px; color: var(--ink-2);
  background: rgba(58,58,60,.5); border-bottom: 1px solid var(--hairline);
}
#scan-strip .dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: .25; } }

/* ---------- 主区 ---------- */
main {
  flex: 1; width: 100%; max-width: 860px; margin: 0 auto;
  padding: 14px 16px calc(90px + env(safe-area-inset-bottom));
}
.seg {
  display: flex; background: var(--surface-2); border-radius: 9px;
  padding: 2px; margin-bottom: 12px;
}
.seg button {
  flex: 1; padding: 6px 0; border-radius: 7px; font-size: 13px; font-weight: 500;
  color: var(--ink-2);
}
.seg button.on { background: var(--surface-3); color: var(--ink-1); font-weight: 600; }

.chips {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; font-size: 12px; color: var(--ink-2);
  background: var(--surface-2); padding: 5px 13px; border-radius: 999px;
}
.chip.on { background: var(--ink-1); color: #000; font-weight: 600; }
.chip:active { opacity: .7; }

/* ---------- 统计页 ---------- */
.stat-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px; margin-bottom: 22px;
}
.stat-card { background: var(--surface-2); border-radius: 12px; padding: 15px 14px; }
.stat-card b {
  display: block; font-size: 25px; font-weight: 700;
  letter-spacing: -.5px; line-height: 1.2; font-variant-numeric: tabular-nums;
}
.stat-card b small { font-size: 13px; font-weight: 600; margin-left: 2px; }
.stat-card > small {
  display: block; color: var(--ink-3); font-size: 12px; margin-top: 3px;
}
.stats-title { font-size: 14px; font-weight: 600; margin: 2px 0 6px; }
.format-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; font-size: 13px; color: var(--ink-1);
}
.format-row.disabled { color: var(--ink-3); }
.format-name {
  width: 88px; flex-shrink: 0; font-weight: 600;
  text-transform: uppercase; font-variant-numeric: tabular-nums;
}
.format-name i { font-style: normal; font-weight: 400; font-size: 11px; }
.format-bar {
  flex: 1; height: 6px; border-radius: 3px;
  background: var(--surface-2); overflow: hidden;
}
.format-bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.format-row.disabled .format-bar i { background: var(--ink-3); }
.format-count {
  width: 56px; flex-shrink: 0; text-align: right;
  color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.stat-empty { color: var(--ink-3); padding: 18px 2px; font-size: 13px; }

/* ---------- 专辑网格 ---------- */
.album-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 18px 14px;
}
.album-card { text-align: left; }
.album-card .art-wrap {
  position: relative; display: block; width: 100%; aspect-ratio: 1;
  border-radius: 8px; overflow: hidden; background: var(--surface-2);
  box-shadow: 0 4px 14px rgba(0,0,0,.4);
}
.album-card img { width: 100%; height: 100%; object-fit: cover; }
.album-card b {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; font-size: 13px; margin-top: 7px; font-weight: 500;
}
.album-card small {
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
  overflow: hidden; font-size: 12px; color: var(--ink-2); margin-top: 2px;
}
.album-card:active .art-wrap { opacity: .75; }

/* ---------- 曲目行 ---------- */
.track-row, .lyric-hit {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 8px 0; text-align: left; border-bottom: 1px solid var(--hairline);
}
.track-row:active, .lyric-hit:active { background: rgba(255,255,255,.04); }
.track-row.disabled .t-title, .track-row.disabled small { opacity: .4; }
.t-lead { width: 22px; flex-shrink: 0; display: flex; justify-content: center; }
.t-index { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.t-main { flex: 1; min-width: 0; }
.t-title {
  display: flex; align-items: center; gap: 5px; font-size: 15px;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.track-row.playing .t-title { color: var(--accent); }
.t-lyric {
  font-style: normal; font-size: 10px; color: var(--ink-2);
  border: 1px solid var(--hairline); border-radius: 4px; padding: 0 3px;
  flex-shrink: 0;
}
.t-format {
  font-style: normal; font-size: 10px; color: var(--ink-3);
  text-transform: uppercase; flex-shrink: 0;
}
.t-main small {
  display: block; font-size: 12px; color: var(--ink-2);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.t-time { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* 下载标 (曲目行右侧, 点按 = 下载; 已下载变勾; 明文 HTTP 下整列不渲染) */
.t-dl {
  width: 26px; height: 26px; flex-shrink: 0; display: flex;
  align-items: center; justify-content: center;
  color: var(--ink-3); border-radius: 50%; margin: -4px -6px -4px 0;
}
.t-dl:active { color: var(--ink-1); background: var(--surface-2); }
.t-dl.done { color: var(--ink-1); }
.dl-pct { font-size: 10px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* 播放中的动条 (替掉序号) */
.bars { display: none; align-items: flex-end; gap: 2px; height: 14px; }
.bars i { width: 3px; background: var(--accent); border-radius: 1px;
          animation: bars-bounce 1s ease-in-out infinite; }
.bars i:nth-child(2) { animation-delay: .25s; }
.bars i:nth-child(3) { animation-delay: .5s; }
@keyframes bars-bounce { 0%, 100% { height: 4px; } 50% { height: 14px; } }
.playing .bars { display: inline-flex; }
.playing .t-lead > :not(.bars) { display: none; }

/* ---------- 艺人行 ---------- */
.artist-row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 8px 0; text-align: left; border-bottom: 1px solid var(--hairline);
}
.artist-row:active { background: rgba(255,255,255,.04); }
.artist-row .poster {
  width: 52px; height: 52px; border-radius: 50%; object-fit: cover;
  background: var(--surface-2); flex-shrink: 0;
}
.a-main { flex: 1; min-width: 0; }
.a-main b { display: block; font-size: 15px; font-weight: 500;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.a-main small { font-size: 12px; color: var(--ink-2); }
.artist-row .chev { color: var(--ink-3); font-size: 18px; }

/* ---------- 详情页头 ---------- */
.album-hero, .artist-hero { display: flex; flex-direction: column; align-items: center;
                            text-align: center; padding: 8px 0 4px; }
.album-hero img {
  width: min(62vw, 260px); aspect-ratio: 1; border-radius: 8px; object-fit: cover;
  background: var(--surface-2); box-shadow: 0 10px 34px rgba(0,0,0,.55);
}
.artist-hero img {
  width: 150px; height: 150px; border-radius: 50%; object-fit: cover;
  background: var(--surface-2); box-shadow: 0 10px 34px rgba(0,0,0,.55);
}
.hero-txt { margin-top: 14px; max-width: 100%; }
.hero-txt h2 { font-size: 20px; line-height: 1.3; }
.hero-artist { color: var(--ink-2); font-size: 14px; margin-top: 3px; }
.hero-artist:active { color: var(--ink-1); }
.hero-txt small, .artist-hero small { color: var(--ink-3); font-size: 12px; margin-top: 4px; }
.action-row { display: flex; gap: 10px; justify-content: center; margin: 16px 0 6px; }
.action {
  display: flex; align-items: center; gap: 6px; justify-content: center;
  font-size: 14px; font-weight: 600; padding: 9px 22px; border-radius: 999px;
  background: var(--surface-2);
}
.action:active { background: var(--surface-3); }
.action[disabled] { opacity: .4; }
.action.primary { background: var(--ink-1); color: #000; }
.action.primary:active { background: #d6d6d8; }
.section-head {
  font-size: 20px; font-weight: 700; margin: 22px 0 12px;
  display: flex; align-items: baseline; gap: 6px;
}
.section-head small { font-size: 13px; color: var(--ink-3); font-weight: 500; }

/* ---------- 搜索 ---------- */
.search-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-2); border-radius: 10px; padding: 0 12px;
  margin-bottom: 12px;
}
.search-box svg { color: var(--ink-3); flex-shrink: 0; }
.search-box input {
  flex: 1; background: none; border: 0; outline: none; color: var(--ink-1);
  font: inherit; padding: 9px 0;
}
.search-box input::placeholder { color: var(--ink-3); }
.search-box input::-webkit-search-cancel-button { display: none; }
#search-clear { color: var(--ink-3); font-size: 14px; padding: 4px; }

/* ---------- 空态/哨兵 ---------- */
.list-empty { padding: 48px 20px; text-align: center; color: var(--ink-3); font-size: 14px; }
.list-sentinel { height: 2px; }

/* ---------- 播放列表行 ---------- */
.playlist-row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 8px 0; text-align: left; border-bottom: 1px solid var(--hairline);
}
.playlist-row:active { background: rgba(255,255,255,.04); }
.pl-icon {
  width: 52px; height: 52px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: #fff;
  background: linear-gradient(135deg, #6e40c8, #fa2d48);
}
.pl-icon.big {
  width: min(62vw, 260px); height: auto; aspect-ratio: 1;
  font-size: min(24vw, 96px); border-radius: 12px;
  box-shadow: 0 10px 34px rgba(0,0,0,.55);
}
.playlist-row .chev { color: var(--ink-3); font-size: 18px; }
.pl-icon.sm { width: 44px; height: 44px; font-size: 18px; border-radius: 8px; }
/* 传过自定义封面的列表: 原图直出 (img 复用同一组尺寸类) */
.pl-icon.art { object-fit: cover; }
img.pl-icon { display: block; }

/* 播放列表详情的封面管理行 (换封面 / 移除) */
.cover-row { display: flex; gap: 10px; justify-content: center; margin: 10px 0 4px; }
.cover-chip {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--ink-2); padding: 7px 16px;
  border-radius: 999px; background: var(--surface-2);
}
.cover-chip:active { background: var(--surface-3); color: var(--ink-1); }

/* 播放列表里每首歌自己的封面 (元数据内嵌图, 44px 小方图替掉序号) */
.t-art {
  width: 44px; height: 44px; border-radius: 6px; object-fit: cover;
  background: var(--surface-2); flex-shrink: 0; display: block;
}
span.t-art { display: flex; align-items: center; justify-content: center;
             color: var(--ink-3); font-size: 16px; }
.t-lead.art { width: auto; }

/* ---------- 设置页 ---------- */
.settings-block {
  background: var(--surface-2); border-radius: 12px;
  padding: 4px 14px; margin-bottom: 14px;
}
.settings-title {
  font-size: 13px; font-weight: 600; color: var(--ink-2);
  padding: 12px 0 2px;
}
.settings-field { padding: 10px 0 12px; border-bottom: 1px solid var(--hairline); }
.settings-block .settings-field:last-child { border-bottom: 0; }
.settings-field > label { display: block; font-size: 14px; font-weight: 500; }
.settings-field > input {
  width: 100%; margin-top: 8px; padding: 9px 12px;
  background: var(--surface-3); border: 0; border-radius: 10px;
  color: var(--ink-1); font: inherit; font-size: 13px;
}
.settings-field > input:focus { outline: 1px solid var(--accent); }
.settings-field > small { display: block; font-size: 11px; color: var(--ink-3); margin-top: 6px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; }
.switch {
  position: relative; width: 46px; height: 28px; border-radius: 999px;
  background: var(--surface-3); flex-shrink: 0; transition: background .2s;
}
.switch i {
  position: absolute; top: 2px; left: 2px; width: 24px; height: 24px;
  border-radius: 50%; background: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.4);
  transition: transform .2s cubic-bezier(.32,.72,0,1);
}
.switch.on { background: var(--accent); }
.switch.on i { transform: translateX(18px); }
.set-save-row { display: flex; justify-content: center; margin: 4px 0 18px; }
.month-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid var(--hairline); font-size: 14px;
}
.settings-block .month-row:last-of-type { border-bottom: 0; }
.month-row b { font-variant-numeric: tabular-nums; }
.month-row small { color: var(--ink-3); font-size: 12px; }
.settings-note { display: block; font-size: 11px; color: var(--ink-3); padding: 10px 0 12px; }

/* ---------- 已下载栏 ---------- */
.dl-row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 8px 0; text-align: left; border-bottom: 1px solid var(--hairline);
}
.dl-row:active { background: rgba(255,255,255,.04); }
.dl-row.busy { opacity: .6; }
.dl-state { font-size: 12px; color: var(--ink-3); flex-shrink: 0;
            font-variant-numeric: tabular-nums; }
.dl-remove {
  font-size: 13px; color: var(--accent); padding: 6px 8px; flex-shrink: 0;
}
.dl-stats {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 10px 0 8px; border-bottom: 1px solid var(--hairline);
}
.dl-stats-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dl-stats-main strong { font-size: 15px; font-variant-numeric: tabular-nums; }
.dl-stats-main small { font-size: 11px; color: var(--ink-3); }
.dl-clear { font-size: 13px; color: #ff3b30; padding: 6px 8px; flex-shrink: 0; }

/* ---------- 迷你播放条 ---------- */
#mini-player {
  position: fixed; left: 8px; right: 8px;
  bottom: calc(8px + env(safe-area-inset-bottom));
  z-index: 45; height: 58px; overflow: hidden;
  display: flex; align-items: center; gap: 10px;
  background: rgba(44,44,46,.88);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--hairline); border-radius: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,.45);
}
#mini-progress {
  position: absolute; top: 0; left: 0; height: 2px;
  background: var(--accent); width: 0; transition: width .3s linear;
}
#mini-open { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0;
             height: 100%; text-align: left; padding-left: 10px; }
#mini-art { width: 42px; height: 42px; border-radius: 6px; object-fit: cover;
            background: var(--surface-3); flex-shrink: 0; }
.mini-txt { flex: 1; min-width: 0; }
.mini-txt b { display: block; font-size: 14px; overflow: hidden;
              white-space: nowrap; text-overflow: ellipsis; }
.mini-txt small { display: block; font-size: 12px; color: var(--ink-2);
                  overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#mini-player > button { padding: 10px; color: var(--ink-1); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; }
#mini-play { margin-right: 2px; }

/* ---------- 全屏播放页 (Apple Music 布局: 顶部左标题右圆钮, 中封面) ---------- */
#full-player {
  position: fixed; inset: 0; z-index: 90; background: #000;
  display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .32s cubic-bezier(.32,.72,0,1);
}
#full-player.open { transform: none; }
.fp-bg { position: absolute; inset: -60px; overflow: hidden; }
.fp-bg img { width: 100%; height: 100%; object-fit: cover;
             filter: blur(70px) brightness(.38) saturate(1.4); }
#full-player.lyrics .fp-bg img { filter: blur(70px) brightness(.22) saturate(1.35); }
.fp-top {
  position: relative; display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 12px) 16px 0;
}
.fp-top > button { color: var(--ink-1); padding: 6px; opacity: .9; flex-shrink: 0; }
.fp-now { flex: 1; min-width: 0; }
.fp-now b { display: block; font-size: 17px; font-weight: 700;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.fp-now small { display: block; font-size: 13px; color: var(--ink-2); margin-top: 1px;
                overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.fp-round {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  border: 1px solid var(--hairline); color: var(--ink-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
}
.fp-round:active { color: var(--ink-1); border-color: var(--ink-2); }
.fp-round.on { color: var(--accent); border-color: var(--accent); }
.fp-body {
  position: relative; flex: 1; min-height: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 18px 28px;
}
#fp-art-wrap { width: 100%; aspect-ratio: 1; max-height: 100%; max-width: min(78vw, 440px);
               margin: auto; }
#fp-art { width: 100%; height: 100%; object-fit: cover; border-radius: 10px;
          background: var(--surface-2); box-shadow: 0 18px 50px rgba(0,0,0,.6); }
#fp-lyrics {
  position: absolute; inset: 0; overflow-y: auto; z-index: 2;
  -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
  mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
  padding: 30% 28px;
}
#lyrics-resume {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  z-index: 3; padding: 7px 16px; border-radius: 999px;
  font-size: 13px; font-weight: 600; color: var(--ink-1);
  background: rgba(44,44,46,.9); border: 1px solid var(--hairline);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
}
.lyrics-line {
  font-size: 21px; font-weight: 700; color: rgba(255,255,255,.32);
  padding: 12px 0; line-height: 1.34; text-align: left;
  filter: blur(3px); will-change: filter;
  transition: filter .5s cubic-bezier(.22,.61,.36,1),
              color .5s cubic-bezier(.22,.61,.36,1),
              font-size .5s cubic-bezier(.22,.61,.36,1);
}
/* 正在唱的一句: 放大 + 清晰; 其余的模糊退后 (滚动动画在 music-player.js) */
.lyrics-line.active { color: #fff; font-size: 26px; filter: blur(0); }
.lyrics-empty { position: absolute; inset: 0; display: flex; align-items: center;
                justify-content: center; color: var(--ink-3); }
.fp-scrub { position: relative; padding: 14px 28px 0; }
#fp-scrub { width: 100%; appearance: none; -webkit-appearance: none;
            height: 22px; background: none; }
#fp-scrub::-webkit-slider-runnable-track {
  height: 5px; border-radius: 3px;
  background: linear-gradient(to right, var(--ink-1) var(--fill, 0%), rgba(255,255,255,.24) 0);
}
#fp-scrub::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: #fff; margin-top: -4.5px; box-shadow: 0 2px 6px rgba(0,0,0,.5);
}
.fp-times { display: flex; justify-content: space-between; font-size: 11px;
            color: var(--ink-3); font-variant-numeric: tabular-nums;
            padding: 2px 28px 0; }
.fp-controls {
  position: relative; display: flex; align-items: center; justify-content: center;
  gap: 22px; padding: 20px 0 12px;
}
.fp-controls > button {
  color: var(--ink-1); padding: 8px;
  display: flex; align-items: center; justify-content: center;
  transition: transform .16s ease, opacity .16s ease;
}
.fp-controls > button:active { transform: scale(.86); opacity: .75; }
/* 播放/暂停: 白色实心圆钮 (Apple Music 参考图, 圆润饱满) */
#fp-play {
  width: 68px; height: 68px; padding: 0; margin: 0 12px;
  border-radius: 50%; background: #fff; color: #000;
}
#fp-play:active { transform: scale(.93); opacity: 1; background: #d6d6d8; }
#fp-shuffle, #fp-repeat { color: var(--ink-3); }
#fp-shuffle.on, #fp-repeat.on { color: var(--ink-1); }
#fp-repeat.one::after {
  content: "1"; position: absolute; font-size: 9px; font-weight: 700;
  margin: -14px 0 0 10px; color: var(--ink-1);
}
.fp-pad { height: calc(20px + env(safe-area-inset-bottom)); }

/* ---------- 队列面板 ---------- */
#queue-mask { position: fixed; inset: 0; z-index: 95; background: rgba(0,0,0,.5); }
#queue-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 96;
  max-height: 72vh; display: flex; flex-direction: column;
  background: rgba(28,28,30,.96);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-radius: 16px 16px 0 0; border: 1px solid var(--hairline);
  transform: translateY(100%); transition: transform .3s cubic-bezier(.32,.72,0,1);
}
#queue-sheet.open { transform: none; }
.sheet-grab { padding: 8px 0 4px; display: flex; justify-content: center; }
.sheet-grab div { width: 36px; height: 4px; border-radius: 2px; background: var(--surface-3); }
.sheet-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 18px 10px; border-bottom: 1px solid var(--hairline);
}
.sheet-head b { font-size: 16px; }
#queue-close { color: var(--accent); font-size: 14px; font-weight: 600; }
#queue-list { overflow-y: auto; padding: 6px 18px calc(16px + env(safe-area-inset-bottom)); }
.queue-row {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 0; text-align: left; border-bottom: 1px solid var(--hairline);
}
.queue-row.on .q-title { color: var(--accent); }
.queue-row .t-lead { width: 18px; }
.q-title { font-size: 14px; flex-shrink: 1; overflow: hidden;
           white-space: nowrap; text-overflow: ellipsis; }
.q-artist { font-size: 12px; color: var(--ink-2); flex-shrink: 0; margin-left: auto; }

/* ---------- 曲目长按菜单 ---------- */
.track-row, .dl-row {
  -webkit-touch-callout: none;        /* iOS 长按不弹放大镜/拷贝气泡 */
  -webkit-user-select: none; user-select: none;
}
#track-menu-mask { position: fixed; inset: 0; z-index: 105; background: rgba(0,0,0,.4); }
#track-menu {
  position: fixed; z-index: 106; min-width: 212px; padding: 5px;
  background: rgba(44,44,46,.96);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--hairline); border-radius: 14px;
  box-shadow: 0 12px 32px rgba(0,0,0,.5);
}
#track-menu .menu-track {
  padding: 6px 12px 9px; margin-bottom: 4px;
  border-bottom: 1px solid var(--hairline);
}
#track-menu .menu-track b {
  display: block; font-size: 14px; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis;
}
#track-menu .menu-track small { font-size: 12px; color: var(--ink-2); }
#track-menu [data-track-action] {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 10px 12px; border-radius: 10px; font-size: 14px; text-align: left;
}
#track-menu [data-track-action]:active { background: var(--surface-3); }
#track-menu [data-track-action] svg { flex-shrink: 0; color: var(--ink-2); }

/* ---------- 添加到播放列表 (选择单) ---------- */
#picker-mask { position: fixed; inset: 0; z-index: 97; background: rgba(0,0,0,.5); }
#picker-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 98;
  max-height: 72vh; display: flex; flex-direction: column;
  background: rgba(28,28,30,.96);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-radius: 16px 16px 0 0; border: 1px solid var(--hairline);
}
.picker-track {
  padding: 4px 18px 10px; border-bottom: 1px solid var(--hairline);
  font-size: 12px; color: var(--ink-3);
}
.picker-track b {
  display: block; font-size: 15px; color: var(--ink-1);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
#picker-list { overflow-y: auto; padding: 4px 12px; min-height: 64px; }
.picker-row {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 11px 6px; text-align: left; border-bottom: 1px solid var(--hairline);
}
.picker-row .a-main { flex: 1; min-width: 0; }
.picker-row b { font-size: 14px; }
.picker-row small { display: block; font-size: 12px; color: var(--ink-2); }
.picker-new {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 18px calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--hairline);
}
.picker-new input {
  flex: 1; min-width: 0; background: var(--surface-2); border: 0;
  border-radius: 10px; padding: 9px 12px; color: var(--ink-1); font-size: 14px;
}
.picker-new input::placeholder { color: var(--ink-3); }
#picker-create {
  color: var(--accent); font-weight: 600; font-size: 14px;
  padding: 6px; flex-shrink: 0;
}

/* ---------- 提示 ---------- */
#toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(8px); z-index: 120;
  max-width: 82vw; padding: 9px 18px; border-radius: 999px;
  background: rgba(58,58,60,.95); color: var(--ink-1); font-size: 13px;
  text-align: center; opacity: 0; transition: opacity .25s, transform .25s;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (min-width: 700px) {
  main { padding-left: 28px; padding-right: 28px; }
  .album-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
}
</style>
</head>
<body>

<audio id="audio" preload="none"></audio>

<header>
  <div class="nav-row">
    <button id="back-btn" hidden>‹ <span id="back-label">资料库</span></button>
    <details class="nav-menu brand-menu" id="brand-menu">
      <summary>My Music<svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="menu">
        <button id="stats-link">统计</button>
        <button id="settings-link">设置</button>
        <button id="rescan" title="增量重扫曲库 (没变的文件只 stat 不读标签)">重新扫描曲库</button>
        <a href="/music/changelog">更新日志</a>
        <button class="logout-row" id="logout" title="退出登录">退出登录</button>
      </div>
    </details>
    <button id="search-btn" aria-label="搜索"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m11 11 3.4 3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
  <div id="view-tabs" hidden>
    <div class="vt-track">
      <button data-view-tab="home">主页</button>
      <button data-view-tab="library">资料库</button>
    </div>
  </div>
</header>

<div id="scan-strip" hidden><span class="dot"></span><span id="scan-text">曲库扫描中</span></div>

<main id="main"><div class="list-empty">加载中…</div></main>

<div id="mini-player" hidden>
  <div id="mini-progress"></div>
  <button id="mini-open">
    <img id="mini-art" alt="">
    <span class="mini-txt"><b id="mini-title"></b><small id="mini-artist"></small></span>
  </button>
  <button id="mini-play" aria-label="播放/暂停"></button>
  <button id="mini-next" aria-label="下一首"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5.5 5.5v13l9-6.5zM16 5h2.5v14h-2.5z" fill="currentColor"/></svg></button>
</div>

<div id="full-player" hidden>
  <div class="fp-bg"><img id="fp-bg-img" alt=""></div>
  <div class="fp-top">
    <button id="fp-close" aria-label="收起播放页"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6 9.5 12 15.5 18 9.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="fp-now"><b id="fp-title"></b><small id="fp-artist"></small></div>
    <button id="fp-queue-btn" class="fp-round" aria-label="播放队列"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 6h16M4 11h10M4 16h13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17.5 13.5v6l4-3z" fill="currentColor"/></svg></button>
    <button id="fp-lyrics-btn" class="fp-round" aria-label="歌词">词</button>
  </div>
  <div class="fp-body">
    <div id="fp-art-wrap"><img id="fp-art" alt=""></div>
    <div id="fp-lyrics" hidden></div>
    <button id="lyrics-resume" hidden>回到当前句</button>
  </div>
  <div class="fp-scrub">
    <input type="range" id="fp-scrub" min="0" max="1000" step="1" value="0" aria-label="进度">
    <div class="fp-times"><span id="fp-time-cur">0:00</span><span id="fp-time-total">0:00</span></div>
  </div>
  <div class="fp-controls">
    <button id="fp-shuffle" aria-label="随机播放"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="fp-prev" aria-label="上一首"><svg viewBox="0 0 24 24" width="46" height="46" aria-hidden="true"><path d="M18.5 5.5v13L9.5 12zM5.5 5h2.4v14h-2.4z" fill="currentColor"/></svg></button>
    <button id="fp-play" aria-label="播放/暂停"></button>
    <button id="fp-next" aria-label="下一首"><svg viewBox="0 0 24 24" width="46" height="46" aria-hidden="true"><path d="M5.5 5.5v13l9-6.5zM16 5h2.5v14h-2.5z" fill="currentColor"/></svg></button>
    <button id="fp-repeat" aria-label="循环模式"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M17 2.5 20.5 6 17 9.5M7 8h9.5a3.5 3.5 0 0 1 3.5 3.5v1M7 21.5 3.5 18 7 14.5M17 16H7.5A3.5 3.5 0 0 1 4 12.5v-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="fp-pad"></div>
</div>

<div id="queue-mask" hidden></div>
<div id="queue-sheet" hidden>
  <div class="sheet-grab"><div></div></div>
  <div class="sheet-head"><b>播放队列</b><button id="queue-close">完成</button></div>
  <div id="queue-list"></div>
</div>

<div id="track-menu-mask" hidden></div>
<div id="track-menu" hidden>
  <div class="menu-track"><b id="menu-track-title"></b><small id="menu-track-artist"></small></div>
  <button data-track-action="play"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6.5 5.5v13l11-6.5z" fill="currentColor"/></svg>播放</button>
  <button data-track-action="artist" id="track-menu-artist"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM5.5 19.5a6.5 6.5 0 0 1 13 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>进入艺人主页</button>
  <button data-track-action="playlist"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6h12M4 11h8M4 16h6M17 14v6M14 17h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>添加到播放列表</button>
  <button data-track-action="share"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3.5v11M8.5 7 12 3.5 15.5 7M6 12v6.5a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>分享</button>
</div>

<div id="picker-mask" hidden></div>
<div id="picker-sheet" hidden>
  <div class="sheet-grab"><div></div></div>
  <div class="sheet-head"><b>添加到播放列表</b><button id="picker-close">完成</button></div>
  <div class="picker-track"><b id="picker-track-title"></b><small>选一个列表, 或在下面新建</small></div>
  <div id="picker-list"></div>
  <div class="picker-new">
    <input id="picker-name" placeholder="新列表的名字" maxlength="30" enterkeyhint="done">
    <button id="picker-create">新建</button>
  </div>
</div>

<div id="toast" hidden></div>

<!-- 播放列表换封面: 选中文件后 JS 直接把字节 PUT 上去 (不用表单) -->
<input type="file" id="cover-file" accept="image/png,image/jpeg,image/webp" hidden>

<script src="/static/menu-user.js?v=1"></script>
<script src="/music/static/lyrics-parser.js?v=1"></script>
<script src="/music/static/player-queue.js?v=1"></script>
<script src="/music/static/downloads.js?v=2"></script>
<script src="/music/static/cellular-usage.js?v=1"></script>
<script src="/music/static/music-common.js?v=4"></script>
<script src="/music/static/music-player.js?v=4"></script>
<script src="/music/static/music.js?v=11"></script>
</body>
</html>
