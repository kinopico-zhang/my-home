<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
     <!-- ↑ 全出血 (页面伸进刘海区): 顶部雷区 (主屏图标竖屏里被系统栅糊的那条
        带) 靠 main 的 margin-top 让出去; env(safe-area-inset-top) 在 main 让位
        和二级页顶衬两处用, 要拿真实值 —— black 会让独立模式报 0。
        但 iOS 26.1 起苹果把 env 误报成 0 (WebKit 301994, 26.5.2/27 复发),
        music.js 的 --sys-top-inset 按机型兜底, CSS 一律 max(env, 兜底) -->
<meta name="apple-mobile-web-app-title" content="My Music">
<link rel="icon" type="image/png" sizes="32x32" href="/music/static/favicon-32.png?v=4">
<link rel="icon" type="image/svg+xml" href="/music/static/favicon.svg?v=3">
<link rel="apple-touch-icon" href="/music/static/apple-touch-icon.png?v=4">
<link rel="manifest" href="/music/static/manifest.json">
<title>My Music</title>
<!-- 样式按逻辑拆成独立文件 (结构化重构): 加载顺序 = 底座 → 内容列表
     → 一级视图 → 底部常驻件 → 推入层 → 播放页 → 浮层菜单 -->
<link rel="stylesheet" href="/music/static/css/music-base.css?v=1">
<link rel="stylesheet" href="/music/static/css/music-bottom-bar.css?v=1">
<link rel="stylesheet" href="/music/static/css/music-push-panes.css?v=1">
<link rel="stylesheet" href="/music/static/css/music-lists.css?v=1">
<link rel="stylesheet" href="/music/static/css/music-views.css?v=1">
<link rel="stylesheet" href="/music/static/css/music-player.css?v=1">
<link rel="stylesheet" href="/music/static/css/music-menus.css?v=1">
</head>
<body>

<audio id="audio" preload="none"></audio>

<!-- 顶带护罩: 让位区里的不透明黑顶带 (磨砂盖纯黑 = 隐形; 详见 CSS 注释) -->
<div id="top-shield" aria-hidden="true"></div>

<!-- 固定壳: 文档不滚, main 是唯一一级滚动器; 页签栏 (fixed bottom) 和气泡
     都钉在视口上, 推入层 (z44) 从它们底下扫过 -->
<main id="main">
<div id="root-view"><div class="list-empty">加载中…</div></div>
</main>

<!-- 二级页推入层: 专辑/艺人/播放列表从右滑入盖住一级, 右划 (左缘起手) 滑回 -->
<div id="push-stack"></div>

     currentColor 吃页签点亮色)。扫描条吊在栏的上沿 (absolute 往上翻):
     出现/消失不挤布局, 页签栏纹丝不动 -->
