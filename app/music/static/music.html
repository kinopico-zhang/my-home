<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
     <!-- ↑ 全出血 (页面伸进刘海区): 顶部雷区 (主屏图标竖屏里被系统栅糊的那条
        带) 靠 main 的 margin-top 让出去; env(safe-area-inset-top) 在 main 让位
        和二级页顶衬两处用, 要拿真实值 —— black 会让独立模式报 0。
        但 iOS 26.1 起苹果把 env 误报成 0 (WebKit 301994, 26.5.2/27 复发),
        music.js 的 --sys-top-inset 按机型兜底, CSS 一律 max(env, 兜底) -->
<meta name="apple-mobile-web-app-title" content="My Music">
<link rel="icon" type="image/png" sizes="32x32" href="/music/static/favicon-32.png?v=4">
<link rel="icon" type="image/svg+xml" href="/music/static/favicon.svg?v=3">
<link rel="apple-touch-icon" href="/music/static/apple-touch-icon.png?v=4">
<link rel="manifest" href="/music/static/manifest.json">
<title>My Music</title>
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --surface: #1c1c1e;
  --surface-2: #2c2c2e;
  --surface-3: #3a3a3c;
  --ink-1: #f5f5f7;
  --ink-2: rgba(235,235,245,.62);
  --ink-3: rgba(235,235,245,.32);
  --hairline: rgba(255,255,255,.09);
  --nav-bg: rgba(10,10,12,.72);
  --accent: #fa2d48;          /* Apple Music 红 */
}
/* app 思路: 全程不画滚动条 (手机本来就不画, 电脑上也干净) —— 能滚, 只是不显示 */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent;
    scrollbar-width: none; }
::-webkit-scrollbar { display: none; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; height: 100%; overflow: hidden; }
     /* 固定壳: 文档本身永不滚 —— 一级页滚动全在 main 内部滚 (用户点名
        滚动时顶栏/气泡也得钉死: iPhone 工具栏只跟文档滚动收放, 文档不滚
        视口就恒定, 钉在视口上的东西无从移动)。overflow 顺带兜底页面撑宽
        (真正的溢出源在 .t-title-text/.t-time 收口) */
body {
  background: var(--bg); color: var(--ink-1);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
               "Helvetica Neue", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45;
  height: 100vh; height: 100dvh;   /* 壳的高度 (dvh 优先); 文档不滚 */
  overflow: hidden;
  display: flex; flex-direction: column;
  touch-action: pan-y;   /* 全应用禁双指缩放: 列表行本来就 pan-y 捏不动,
                             但页签栏/气泡这种 fixed 层上捏还是会把页面放大
                             (一放大钉底的页签栏就浮起来, 底下露出黑边) ——
                             在 body 收口, 全站统一捏不动; 抓手/封面/滑杆
                             这些手势区自带 touch-action: none 不受影响 */
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button, a, summary { touch-action: manipulation; }
img { display: block; }

/* ---------- 底部页签栏 (磨砂, 与气泡同配方) ----------
   原来的顶部页签栏在独立 app (主屏图标) 竖屏里整条被 iOS 栅成低清
   (用户实测: 钉自家合成层/撤磨砂/换状态栏样式三招全试过救不动;
   横屏和浏览器里都好, 屏底的气泡一直清晰) —— 索性把导航整个搬到底部,
   顶上那块雷区让出去。主页/资料库/搜索/设置四个图标页签, 设置页签 =
   原品牌菜单的职能搬进设置页 (统计/重扫/更新日志/退出登录都在那)。 */
:root { --tabbar-h: 38px; }   /* 页签栏自高 (行高定死, 图标23+标签10 整体居中):
                                  44 用户还嫌高再压一档; 气泡让位和内容下衬垫都按它算 */
#tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  display: flex; justify-content: center;
  padding: 0 max(8px, env(safe-area-inset-left))
           env(safe-area-inset-bottom) max(8px, env(safe-area-inset-right));
  background: rgba(44,44,46,.6);   /* 磨砂玻璃, 气泡同款半透明 */
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid var(--hairline);
  transform: translateZ(0);   /* 自家合成层: 推入层从它底下扫过时复印不进 */
}
#tabbar .tab-row {
  display: flex; gap: 2px; width: 100%; max-width: 860px;
  height: var(--tabbar-h); align-items: stretch;
}
#tabbar button {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 1px;   /* 图标+文字作为整体在键高里上下居中 */
  padding: 0; border-radius: 8px; line-height: 1;
  font-size: 10px; font-weight: 500; color: var(--ink-3);
}
#tabbar button.on { color: var(--accent); font-weight: 600; }
#tabbar svg { display: block; }

/* ---------- 顶带护罩 (不透明黑顶带) ----------
   iOS 26.1+ 系统 bug (WebKit 301994) 会在主屏独立应用顶部盖一条网页
   永远够不着的磨砂带; 磨砂盖在纯黑上时看不出来, 所以让位区里铺一块
   不透明的黑罩 —— 滚进顶部的内容只会被它干净遮住 (像普通应用的状态
   栏), 不再被系统栅糊; 推下变体里系统从网页顶部抓拍的带子也只剩纯黑,
   残影跟着隐形。高度与三处让位同源: max(env, 兜底), 健康设备/浏览器
   里 env 正常、罩子只到状态栏下缘, 看不出区别; 桌面上恒 0 不渲染。 */
#top-shield {
  position: fixed; top: 0; left: 0; right: 0; z-index: 96;
  height: max(env(safe-area-inset-top), var(--sys-top-inset, 0px));
  background: #000;
}

/* 首帧兜底: 中招系统里 JS 启动前的那一帧也别让内容钻进磨砂带 —— 独立
   模式竖屏先给 --sys-top-inset 一个按最深带子量的默认值 (393×852 机型
   59+88=147), music.js 一跑就按真实机型/变体覆写成准确值 (健康设备/
   横屏/浏览器清回 0)。不然首帧内容顶到 env 谎报的位置, 系统抓拍条
   (推下变体) 拍到的就是内容而不是黑罩。 */
@media (display-mode: standalone) and (orientation: portrait) {
  :root { --sys-top-inset: 147px; }
}

/* ---------- 扫描进度条 (吊在页签栏上沿的浮层, 不挤布局) ---------- */
#scan-strip {
  position: absolute; left: 0; right: 0; top: 0; transform: translateY(-100%);
  display: flex; align-items: center; gap: 8px;
  padding: 7px 16px; font-size: 12px; color: var(--ink-2);
  background: rgba(58,58,60,.85);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid var(--hairline);
  box-shadow: 0 -10px 20px rgba(0,0,0,.35);
}
#scan-strip .dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: .25; } }

/* ---------- 主区 ---------- */
main {
  flex: 1; width: 100%; min-height: 0;   /* min-height:0: flex 子不缩就滚不动 */
  /* 顶部雷区让位 (顶栏发糊同源: 独立模式竖屏里屏幕最上那条带子被系统栅成
     低清, 什么进去都糊) —— main 整个下移, 滚动内容永远进不了那条带子,
     带子里只剩 body 黑底。只给内容加 padding 不行: 一滚字就又钻进带子里。
     max(env, 兜底): iOS 26.1+ 的系统 bug (WebKit 301994) 把 env 误报成 0,
     music.js 按机型屏幕尺寸表给 --sys-top-inset 兜一个近似刘海高度 */
  margin-top: max(env(safe-area-inset-top), var(--sys-top-inset, 0px));
  overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: none;
}
/* 一级页内容列: 限宽居中 (页签栏/气泡都是 fixed, 内容得自己让开底下的高度);
   横屏时左右让开侧刘海 (env 取 max, 没侧刘海的场合保底 16px) */
#root-view {
  max-width: 860px; margin: 0 auto;
  padding: 14px max(16px, env(safe-area-inset-right))
           calc(var(--tabbar-h) + 90px + env(safe-area-inset-bottom))
           max(16px, env(safe-area-inset-left));
}

/* ---------- 二级页推入层 (专辑/艺人/播放列表, iOS 设置式滑入) ---------- */
#push-stack { position: fixed; inset: 0; z-index: 44; pointer-events: none; }
/* 设计一致 (用户点名): 推入层铺满全高, 内容照主页那样从磨砂气泡底下扫过
   (原来气泡下面是一条空带)。代价: 层动起来时变换层会从 fixed+磨砂的
   气泡和页签栏底下扫过 —— 这是 WebKit 吐重影的配方 (用户截图过第二个气泡),
   对策 = 运动期暂撤磨砂换实底 (body.pane-anim, JS 的 paneMotion() 管),
   歇下来再恢复磨砂。 */
body.pane-anim #mini-player, body.pane-anim #tabbar {
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  background: rgba(44,44,46,.92);
}
.push-pane {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0;
  display: flex; justify-content: center;      /* 内容列宽对齐 main 的 860px */
  background: var(--bg);
  box-shadow: -10px 0 26px -8px rgba(0,0,0,.5);  /* 收紧竖向渗出: 磨砂气泡
    取样区比本体外扩 blur(20), 投影渗进取样区也是重影的引子 */
  transform: translateX(100%);
  transition: transform .34s cubic-bezier(.32,.72,.35,1);
  will-change: transform;   /* 层终身常驻: 滑出结束不降级合并 (合并瞬间
    WebKit 会把旁边的固定元素复印进来 = 收层时气泡跟着页面跑的元凶) */
  pointer-events: auto;
  touch-action: pan-y;                         /* 横拖留给右划返回手势 */
  user-select: none; -webkit-user-select: none;
}
.push-pane img { -webkit-user-drag: none; }    /* 右划别拖出图片幽灵 */
.push-pane.open { transform: translateX(0); }
.push-pane .pane-scroll {
  width: 100%; max-width: 860px; height: 100%;
  overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: none;
  padding: calc(max(env(safe-area-inset-top), var(--sys-top-inset, 0px)) + 14px)
           16px
           calc(var(--tabbar-h) + 90px + env(safe-area-inset-bottom));
}
/* 常驻顶端的栏 (资料库页签条 / 搜索框): sticky 钉在 main 顶 (护罩下缘),
   底衬不透明, 列表往上滚时从它底下扫过去 —— 栏不跟着列表滚走 */
.sticky-head {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  padding: 2px 0 12px;
}
.seg {
  display: flex; background: var(--surface-2); border-radius: 9px;
  padding: 2px;
}
.seg button {
  flex: 1; padding: 6px 0; border-radius: 7px; font-size: 13px; font-weight: 500;
  color: var(--ink-2);
}
.seg button.on { background: var(--surface-3); color: var(--ink-1); font-weight: 600; }

.chips {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px;
}
.chip {
  flex-shrink: 0; font-size: 12px; color: var(--ink-2);
  background: var(--surface-2); padding: 5px 13px; border-radius: 999px;
}
.chip.on { background: var(--ink-1); color: #000; font-weight: 600; }
.chip:active { opacity: .7; }

/* ---------- 统计页 ---------- */
.stat-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px; margin-bottom: 22px;
}
.stat-card { background: var(--surface-2); border-radius: 12px; padding: 15px 14px; }
.stat-card b {
  display: block; font-size: 25px; font-weight: 700;
  letter-spacing: -.5px; line-height: 1.2; font-variant-numeric: tabular-nums;
}
.stat-card b small { font-size: 13px; font-weight: 600; margin-left: 2px; }
.stat-card > small {
  display: block; color: var(--ink-3); font-size: 12px; margin-top: 3px;
}
.stats-title { font-size: 14px; font-weight: 600; margin: 2px 0 6px; }
.format-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; font-size: 13px; color: var(--ink-1);
}
.format-row.disabled { color: var(--ink-3); }
.format-name {
  width: 88px; flex-shrink: 0; font-weight: 600;
  text-transform: uppercase; font-variant-numeric: tabular-nums;
}
.format-name i { font-style: normal; font-weight: 400; font-size: 11px; }
.format-bar {
  flex: 1; height: 6px; border-radius: 3px;
  background: var(--surface-2); overflow: hidden;
}
.format-bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.format-row.disabled .format-bar i { background: var(--ink-3); }
.format-count {
  width: 56px; flex-shrink: 0; text-align: right;
  color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.stat-empty { color: var(--ink-3); padding: 18px 2px; font-size: 13px; }

/* ---------- 专辑网格 ---------- */
.album-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 18px 14px;
}
.album-card { text-align: left; }
.album-card .art-wrap {
  position: relative; display: block; width: 100%; aspect-ratio: 1;
  border-radius: 8px; overflow: hidden; background: var(--surface-2);
  box-shadow: 0 4px 14px rgba(0,0,0,.4);
}
.album-card img { width: 100%; height: 100%; object-fit: cover; }
.album-card b {
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
  overflow: hidden; font-size: 13px; margin-top: 7px; font-weight: 500;
}
.album-card small {
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
  overflow: hidden; font-size: 12px; color: var(--ink-2); margin-top: 2px;
}
.album-card:active .art-wrap { opacity: .75; }

/* ---------- 曲目行 ---------- */
.track-row, .lyric-hit {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 8px 0; text-align: left; border-bottom: 1px solid var(--hairline);
}
.track-row:active, .lyric-hit:active { background: rgba(255,255,255,.04); }
.track-row.disabled .t-title, .track-row.disabled small { opacity: .4; }
.t-lead { width: 22px; flex-shrink: 0; display: flex; justify-content: center; }
.t-main { flex: 1; min-width: 0; }
.t-title {
  display: flex; align-items: center; gap: 5px; font-size: 15px;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
/* 标题文字单独包一层可收缩: 不然 flex 行里裸文本压不扁,
   长歌名把「词/格式」小标顶出屏幕 (元素超宽, 手机上整页跟着能左右滑) */
.t-title-text {
  flex: 1; min-width: 0; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis;
}
.track-row.playing .t-title { color: var(--accent); }
/* 词标 ❝: 行右侧图标簇的一员 (下载标前面), 同 26px 高度框 ——
   两个图标在行里同一个水平线上, 大小也一样 (17px)。 */
.t-lyric {
  display: flex; align-items: center; height: 26px; flex-shrink: 0;
  color: var(--ink-2);
}
.t-format {
  font-style: normal; font-size: 10px; color: var(--ink-3);
  text-transform: uppercase; flex-shrink: 0;
}
.t-main small {
  display: block; font-size: 12px; color: var(--ink-2);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
/* 右列多数是时长 (短), 歌词命中行放的是艺人名: 都要能收缩省略,
   长名字不许把行撑破 */
.t-time {
  font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums;
  flex-shrink: 1; min-width: 0; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis;
}

/* 下载标 (曲目行右侧, 点按 = 下载; 已下载变勾; 明文 HTTP 下整列不渲染)。
   颜色与词标 ❝ 同一档 (行右侧图标簇一个色, 没有色差)。 */
.t-dl {
  width: 26px; height: 26px; flex-shrink: 0; display: flex;
  align-items: center; justify-content: center;
  color: var(--ink-2); border-radius: 50%; margin: -4px -6px -4px 0;
}
.t-dl:active { color: var(--ink-1); background: var(--surface-2); }
.t-dl.done { color: var(--ink-1); }
.dl-pct { font-size: 10px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* 播放中的动条 (替掉序号) */
.bars { display: none; align-items: flex-end; gap: 2px; height: 14px; }
.bars i { width: 3px; background: var(--accent); border-radius: 1px;
          animation: bars-bounce 1s ease-in-out infinite; }
.bars i:nth-child(2) { animation-delay: .25s; }
.bars i:nth-child(3) { animation-delay: .5s; }
@keyframes bars-bounce { 0%, 100% { height: 4px; } 50% { height: 14px; } }
.playing .bars { display: inline-flex; }
/* 序号行: 播放中动条顶掉序号; 封面行 (播放列表/选择单) 封面不许被顶掉
   —— 动条胶囊叠在封面中央, 深底衬着, 任何封面都看得清 */
.playing .t-lead:not(.art) > :not(.bars) { display: none; }
.t-lead.art { position: relative; }
.playing .t-lead.art .bars {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  padding: 6px 5px; border-radius: 999px;
  background: rgba(0, 0, 0, .58);
}

/* ---------- 艺人行 ---------- */
.artist-row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 8px 0; text-align: left; border-bottom: 1px solid var(--hairline);
}
.artist-row:active { background: rgba(255,255,255,.04); }
.artist-row .poster {
  width: 52px; height: 52px; border-radius: 50%; object-fit: cover;
  background: var(--surface-2); flex-shrink: 0;
}
.a-main { flex: 1; min-width: 0; }
.a-main b { display: block; font-size: 15px; font-weight: 500;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.a-main small { font-size: 12px; color: var(--ink-2); }
.artist-row .chev { color: var(--ink-3); font-size: 18px; }

/* ---------- 详情页头 ---------- */
.album-hero, .artist-hero { display: flex; flex-direction: column; align-items: center;
                            text-align: center; padding: 8px 0 4px; }
.album-hero img {
  width: min(62vw, 260px); aspect-ratio: 1; border-radius: 8px; object-fit: cover;
  background: var(--surface-2); box-shadow: 0 10px 34px rgba(0,0,0,.55);
}
.artist-hero img {
  width: 150px; height: 150px; border-radius: 50%; object-fit: cover;
  background: var(--surface-2); box-shadow: 0 10px 34px rgba(0,0,0,.55);
}
.hero-txt { margin-top: 14px; max-width: 100%; }
.hero-txt h2 { font-size: 20px; line-height: 1.3; }
.hero-artist { color: var(--ink-2); font-size: 14px; margin-top: 3px; }
.hero-artist:active { color: var(--ink-1); }
.hero-txt small, .artist-hero small { color: var(--ink-3); font-size: 12px; margin-top: 4px; }
.action-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
              margin: 16px 0 6px; }
.action {
  display: flex; align-items: center; gap: 6px; justify-content: center;
  font-size: 14px; font-weight: 600; padding: 9px 22px; border-radius: 999px;
  background: var(--surface-2);
}
.action:active { background: var(--surface-3); }
.action[disabled] { opacity: .4; }
.action.primary { background: var(--ink-1); color: #000; }
.action.primary:active { background: #d6d6d8; }
/* 纯图标操作钮 (列表页一行四五个动作装不下文字): 圆角方块, 图标放大到 20 */
.action.icon { padding: 10px; border-radius: 12px; }
.action.icon svg { width: 20px; height: 20px; }

/* ---------- 左滑删除 (iOS 同款) ----------
   .swipe-wrap 里第一个子元素是行 (横移跟手), .swipe-del 垫在右缘底下;
   行透明会让删除钮透出来 → 行必须铺底色 (与页面同色)。 */
.swipe-wrap { position: relative; overflow: hidden; }
.swipe-wrap > button:first-child {
  position: relative; z-index: 1; background: var(--bg);
  transition: transform .25s cubic-bezier(.25,.1,.25,1); touch-action: pan-y;
}
/* 拖动跟手 (松手的回位/定住才交给上面的过渡) —— 队列拖拽同款手法 */
.swipe-wrap > button:first-child.swiping { transition: none; }
.swipe-del {
  position: absolute; top: 0; right: 0; bottom: 0; z-index: 0;
  width: 72px; display: flex; align-items: center; justify-content: center;
  background: #e5484d; color: #fff; font-size: 14px; font-weight: 600;
}
.swipe-del:active { background: #cf3942; }

.section-head {
  font-size: 20px; font-weight: 700; margin: 22px 0 12px;
  display: flex; align-items: baseline; gap: 6px;
}
.section-head small { font-size: 13px; color: var(--ink-3); font-weight: 500; }

/* ---------- 搜索 ---------- */
.search-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-2); border-radius: 10px; padding: 0 12px;
}
.search-box svg { color: var(--ink-3); flex-shrink: 0; }
.search-box input {
  flex: 1; background: none; border: 0; outline: none; color: var(--ink-1);
  font: inherit; font-size: 16px;   /* iOS: 聚焦小于 16px 的输入框会自动放大整页 */
  padding: 9px 0;
}
.search-box input::placeholder { color: var(--ink-3); }
.search-box input::-webkit-search-cancel-button { display: none; }
#search-clear { color: var(--ink-3); font-size: 14px; padding: 4px; }

/* ---------- 空态/哨兵 ---------- */
.list-empty { padding: 48px 20px; text-align: center; color: var(--ink-3); font-size: 14px; }
.list-sentinel { height: 2px; }

/* ---------- 播放列表行 ---------- */
.playlist-row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 8px 0; text-align: left; border-bottom: 1px solid var(--hairline);
}
.playlist-row:active { background: rgba(255,255,255,.04); }
.pl-icon {
  width: 52px; height: 52px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: #fff;
  background: linear-gradient(135deg, #6e40c8, #fa2d48);
}
.pl-icon.big {
  width: min(62vw, 260px); height: auto; aspect-ratio: 1;
  font-size: min(24vw, 96px); border-radius: 12px;
  box-shadow: 0 10px 34px rgba(0,0,0,.55);
}
.playlist-row .chev { color: var(--ink-3); font-size: 18px; }
.pl-icon.sm { width: 44px; height: 44px; font-size: 18px; border-radius: 8px; }
/* 传过自定义封面的列表: 原图直出 (img 复用同一组尺寸类) */
.pl-icon.art { object-fit: cover; }
img.pl-icon { display: block; }

/* 播放列表的大封面: 点一下直接换 (角标提示可点) */
.pl-cover-btn {
  position: relative; display: block; padding: 0; margin: 0;
  border: none; background: none; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.pl-cover-btn .pl-icon.big { transition: transform .15s ease; }
.pl-cover-btn:active .pl-icon.big { transform: scale(.97); }
.cover-hint {
  position: absolute; right: 10px; bottom: 10px;
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, .55); color: #fff;
}
.cover-hint svg { width: 15px; height: 15px; }

/* 播放列表里每首歌自己的封面 (元数据内嵌图, 44px 小方图替掉序号) */
.t-art {
  width: 44px; height: 44px; border-radius: 6px; object-fit: cover;
  background: var(--surface-2); flex-shrink: 0; display: block;
}
span.t-art { display: flex; align-items: center; justify-content: center;
             color: var(--ink-3); font-size: 16px; }
.t-lead.art { width: auto; }

/* ---------- 设置页 ---------- */
.settings-block {
  background: var(--surface-2); border-radius: 12px;
  padding: 4px 14px; margin-bottom: 14px;
}
.settings-title {
  font-size: 13px; font-weight: 600; color: var(--ink-2);
  padding: 12px 0 2px;
}
.settings-field { padding: 10px 0 12px; border-bottom: 1px solid var(--hairline); }
.settings-block .settings-field:last-child { border-bottom: 0; }
.settings-field > label { display: block; font-size: 14px; font-weight: 500; }
.settings-field > input {
  width: 100%; margin-top: 8px; padding: 9px 12px;
  background: var(--surface-3); border: 0; border-radius: 10px;
  color: var(--ink-1); font: inherit; font-size: 16px;   /* iOS 聚焦 <16px 会自动放大整页 */
}
.settings-field > input:focus { outline: 1px solid var(--accent); }
.settings-field > small { display: block; font-size: 11px; color: var(--ink-3); margin-top: 6px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; }
.switch {
  position: relative; width: 46px; height: 28px; border-radius: 999px;
  background: var(--surface-3); flex-shrink: 0; transition: background .2s;
}
.switch i {
  position: absolute; top: 2px; left: 2px; width: 24px; height: 24px;
  border-radius: 50%; background: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.4);
  transition: transform .2s cubic-bezier(.32,.72,0,1);
}
.switch.on { background: var(--accent); }
.switch.on i { transform: translateX(18px); }
.set-save-row { display: flex; justify-content: center; margin: 4px 0 18px; }
.month-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid var(--hairline); font-size: 14px;
}
.settings-block .month-row:last-of-type { border-bottom: 0; }
.month-row b { font-variant-numeric: tabular-nums; }
.month-row small { color: var(--ink-3); font-size: 12px; }
.settings-note { display: block; font-size: 11px; color: var(--ink-3); padding: 10px 0 12px; }
/* 入口行 (原品牌菜单搬进设置页的职能: 统计/更新日志/重扫/退出登录) */
.settings-row {
  display: flex; align-items: center; width: 100%;
  padding: 11px 0; text-align: left; font-size: 14px; color: var(--ink-1);
  border-bottom: 1px solid var(--hairline);
}
.settings-block .settings-row:last-child { border-bottom: 0; }
.settings-row:active { opacity: .6; }
.settings-row.logout { color: #e5484d; }
.settings-user {
  display: flex; align-items: center; gap: 8px; padding: 11px 0;
  border-bottom: 1px solid var(--hairline); font-size: 14px;
  color: var(--ink-2); -webkit-user-select: none; user-select: none;
}
.settings-user svg { flex-shrink: 0; opacity: .7; }
.settings-user span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.settings-user em {
  font-style: normal; font-size: 10px; color: #7db3f0;
  border: 1px solid rgba(125,179,240,.5); border-radius: 4px;
  padding: 0 4px; margin-left: auto; flex-shrink: 0;
}

/* ---------- 更新日志 (应用内视图, 听歌不中断) ----------
   版本卡片样式与独立日志页 /music/changelog 同款 */
#changelog-entries { background: var(--surface); border: 1px solid var(--hairline);
                     border-radius: 14px; overflow: hidden; }
#changelog-entries .ver { padding: 12px 14px; }
#changelog-entries .ver + .ver { border-top: 1px solid var(--hairline); }
#changelog-entries .v-head { display: flex; align-items: baseline;
                             gap: 8px; margin-bottom: 9px; }
#changelog-entries .v-badge {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 15px; font-weight: 600; color: #7db3f0;
  font-variant-numeric: tabular-nums;
}
#changelog-entries .v-date {
  font-size: 11px; color: var(--ink-3);
  font-family: ui-monospace, Menlo, monospace;
}
#changelog-entries .v-items { list-style: none;
                              display: flex; flex-direction: column; gap: 7px; }
#changelog-entries .v-items li {
  display: flex; gap: 8px; align-items: flex-start;
  font-size: 13.5px; line-height: 1.45; word-break: break-word;
}
#changelog-entries .k { flex: none; margin-top: 2px; font-size: 10.5px;
                        font-weight: 600; padding: 1.5px 7px; border-radius: 6px;
                        white-space: nowrap; }
#changelog-entries .k-add { color: #7db3f0; background: rgba(57,135,229,.18); }
#changelog-entries .k-imp { color: #f0b13d; background: rgba(224,138,60,.16); }
#changelog-entries .k-fix { color: #6fce8e; background: rgba(31,163,73,.16); }
#changelog-entries .t { flex: 1; min-width: 0; }

/* ---------- 已下载栏 ---------- */
.dl-row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 8px 0; text-align: left; border-bottom: 1px solid var(--hairline);
}
.dl-row:active { background: rgba(255,255,255,.04); }
.dl-row.busy { opacity: .6; }
.dl-state { font-size: 12px; color: var(--ink-3); flex-shrink: 0;
            font-variant-numeric: tabular-nums; }
.dl-remove {
  font-size: 13px; color: var(--accent); padding: 6px 8px; flex-shrink: 0;
}
.dl-stats {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 10px 0 8px; border-bottom: 1px solid var(--hairline);
}
.dl-stats-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dl-stats-main strong { font-size: 15px; font-variant-numeric: tabular-nums; }
.dl-stats-main small { font-size: 11px; color: var(--ink-3); }
.dl-clear { font-size: 13px; color: #ff3b30; padding: 6px 8px; flex-shrink: 0; }

/* ---------- 迷你播放条 ---------- */
#mini-player {
  position: fixed; left: 8px; right: 8px;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 8px);   /* 叠在页签栏上 */
  z-index: 45; height: 58px; overflow: hidden;
  display: flex; align-items: center; gap: 10px;
  background: rgba(44,44,46,.6);   /* 磨砂玻璃 (用户点名): 六成底色,
    blur(20) 把底下划过的内容糊成影子透上来 —— 和顶栏一个质感 */
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--hairline); border-radius: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,.45);
  transform: translateZ(0);   /* 自家合成层: WebKit 复印不进旁边任何变换层
    (收层动画里气泡跟着页面跑的另一半保险) */
}
#mini-progress {
  position: absolute; top: 0; left: 0; height: 2px;
  background: var(--accent); width: 0; transition: width .3s linear;
}
#mini-open { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0;
             height: 100%; text-align: left; padding-left: 10px; }
#mini-art { width: 42px; height: 42px; border-radius: 6px; object-fit: cover;
            background: var(--surface-3); flex-shrink: 0; }
.mini-txt { flex: 1; min-width: 0; }
.mini-txt b { display: block; font-size: 14px; overflow: hidden;
              white-space: nowrap; text-overflow: ellipsis; }
.mini-txt small { display: block; font-size: 12px; color: var(--ink-2);
                  overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#mini-player > button { padding: 10px; color: var(--ink-1); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; }
/* 播放键字形 28px 比上下曲 24px 大一号: 三角/双杠是紧凑实心形,
   跟宽箭头同尺寸会显得小 (用户点名 "比上一首下一首还小"), 大一号才齐平 */
#mini-play svg { display: block; }

/* ---------- 全屏播放页 (参考图 1:1: 氛围底 + 顶部抓手 + 大封面 + 底部控件栈) ---------- */
#full-player {
  position: fixed; inset: 0; z-index: 90; background: #000;
  transform: translateY(100%); transition: transform .32s cubic-bezier(.32,.72,0,1);
}
#full-player.open { transform: none; }
/* 抓手条横拖收起: 整页向右甩出 (默认收起仍向下) */
#full-player.dismiss-right { transform: translateX(100%); }
.fp-bg { position: absolute; inset: -60px; overflow: hidden; }
.fp-bg img { width: 100%; height: 100%; object-fit: cover;
             filter: blur(70px) brightness(.45) saturate(1.3); }
#full-player.lyrics .fp-bg img { filter: blur(70px) brightness(.22) saturate(1.35); }
#full-player.queue .fp-bg img { filter: blur(70px) brightness(.3) saturate(1.35); }
.fp-sheet {
  position: relative; height: 100%; max-width: 520px; margin: 0 auto;
  display: flex; flex-direction: column;
}
/* 顶部抓手条: 点一下 (或往下拖) 收起播放页 */
#fp-grab {
  display: flex; justify-content: center; align-items: flex-start;
  padding: calc(max(env(safe-area-inset-top, 0px), var(--sys-top-inset, 0px)) + 3px)
           0 0;
  border: 0; background: none; touch-action: none;
}
#fp-grab div { width: 60px; height: 5px; border-radius: 2.5px;
               background: rgba(255,255,255,.5); }
.fp-body {
  position: relative; flex: 1; min-height: 120px;
  display: flex; align-items: center; justify-content: center;
  padding: 41px 24px 42px;
}
#fp-art-wrap { width: 100%; aspect-ratio: 1; max-height: 100%;
               max-width: min(100%, 440px); touch-action: none; }
/* 封面不许原生拖拽/长按呼出 (不然下拉手势被 dragstart 劫持, 桌面端直接断流) */
#fp-art-wrap, #fp-art { -webkit-user-drag: none; user-select: none;
                        -webkit-touch-callout: none; }
#fp-art { width: 100%; height: 100%; object-fit: cover; border-radius: 8px;
          background: rgba(255,255,255,.08); box-shadow: 0 18px 50px rgba(0,0,0,.55); }
#fp-lyrics {
  position: absolute; inset: 0; overflow-y: auto; z-index: 2;
  -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
  mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
  padding: 30% 28px;
}
#lyrics-resume {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  z-index: 3; padding: 7px 16px; border-radius: 999px;
  font-size: 13px; font-weight: 600; color: var(--ink-1);
  background: rgba(44,44,46,.9); border: 1px solid var(--hairline);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
}
.lyrics-line {
  font-size: 21px; font-weight: 700; color: rgba(255,255,255,.32);
  padding: 12px 0; line-height: 1.34; text-align: left;
  filter: blur(3px); will-change: filter;
  transition: filter .5s cubic-bezier(.22,.61,.36,1),
              color .5s cubic-bezier(.22,.61,.36,1),
              font-size .5s cubic-bezier(.22,.61,.36,1);
}
/* 距离模糊: 离当前句越近越清晰 (默认远处 3px), 近一两句半模糊,
   正在唱的一句全清 + 放大 (滚动动画在 music-player.js) */
.lyrics-line.near-2 { filter: blur(2px); }
.lyrics-line.near-1 { filter: blur(1px); }
.lyrics-line.active { color: #fff; font-size: 26px; filter: blur(0); }
/* 手动滑动浏览期间整页清晰 (music-player.js 切换 browsing);
   无时间轴歌词没有"当前句"可依 (static), 也整页清晰 */
#fp-lyrics.browsing .lyrics-line,
#fp-lyrics.static .lyrics-line { filter: blur(0); }
.lyrics-empty { position: absolute; inset: 0; display: flex; align-items: center;
                justify-content: center; color: var(--ink-3); }
/* 标题行: 左歌名歌手, 右 ⋯ */
.fp-meta { display: flex; align-items: center; gap: 12px; padding: 0 32px; }
.fp-now { flex: 1; min-width: 0; }
.fp-now b { display: block; font-size: 19px; font-weight: 700; color: #fff;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.fp-now small { display: block; font-size: 12px; color: rgba(255,255,255,.62);
                margin-top: 2px; overflow: hidden; white-space: nowrap;
                text-overflow: ellipsis; }
#fp-menu-btn { color: #fff; opacity: .9; padding: 12px; flex-shrink: 0; }
/* 传输三键: 站进度条正上方居中 (用户点名: 在上面, 不是旁边);
   三键一般大 —— 播放键不再大一号 (用户: 中间的播放键过于巨大) */
.fp-controls { display: flex; align-items: center; justify-content: center;
               gap: 32px; margin-top: 16px; }
.fp-controls > button {
  width: 44px; height: 44px; color: #fff; padding: 0;
  display: flex; align-items: center; justify-content: center;
  transition: transform .16s ease, opacity .16s ease;
}
.fp-controls > button:active { transform: scale(.86); opacity: .75; }
/* 进度行: 两头倒数式时间 (−已播/−剩余), 中间进度条撑满剩余空间 */
.fp-transport { display: flex; align-items: center; gap: 10px;
                margin-top: 10px; padding: 0 24px; }
.fp-time { flex-shrink: 0; font-size: 10px; color: rgba(255,255,255,.5);
           font-variant-numeric: tabular-nums; }
/* 细进度条: 无旋钮 (滑块和填充同色, 静止时看不出)。range 住在 flex 行里
   不会自动让位 (固有宽度顶住), flex:1 + min-width:0 才肯撑满剩余空间 */
.fp-scrub { flex: 1; min-width: 0; }
/* 滑杆命中层: iOS 的 range 点轨道不跳值、小滑钮抓不住 (音量条整个点不动),
   输入框蒙一层透明垫子自己算比例 —— 按下即跳、拖动跟手 (见 music-player.js) */
.slider-hit { position: relative; touch-action: none;
              -webkit-user-select: none; user-select: none;
              -webkit-touch-callout: none; }
.fp-scrub .slider-hit { height: 28px; }   /* 轨道只有 7px, 命中区给足 */
.slider-hit input[type="range"] { pointer-events: none; width: 100%; height: 100%;
  appearance: none; -webkit-appearance: none; background: none; }
#fp-scrub::-webkit-slider-runnable-track {
  height: 7px; border-radius: 3.5px;
  background: linear-gradient(to right, rgba(255,255,255,.7) var(--fill, 0%),
                              rgba(255,255,255,.3) 0);
}
#fp-scrub::-webkit-slider-thumb {
  -webkit-appearance: none; width: 7px; height: 7px; border-radius: 50%;
  background: rgba(255,255,255,.7); margin-top: 0;
}
/* 底部三键: 加列表 / 歌词 / 队列 (无损标挂在队列键右上角) —— 与传输区
   分成两拨, 中间留白给足 */
.fp-actions { display: flex; align-items: center; justify-content: space-between;
              margin-top: 18px; padding: 0 53px; color: rgba(255,255,255,.58); }
.fp-actions > button { position: relative; width: 40px; height: 40px; padding: 0;
  display: flex; align-items: center; justify-content: center; }
.fp-actions > button:active { opacity: .6; }
#fp-lyrics-btn.on { color: #fff; }
#fp-lyrics-btn:disabled { opacity: .35; }   /* 探明没歌词的曲子, 键灰掉点不开 */
#fp-queue-btn.on { color: #fff; }           /* 队列翻开着 (封面区显示队列) */
.fp-source { margin-top: 10px; padding: 0 32px; text-align: center; font-size: 13px;
             color: rgba(255,255,255,.75); overflow: hidden; white-space: nowrap;
             text-overflow: ellipsis; }
.fp-pad { height: 22px; flex-shrink: 0; }
/* 横屏 (矮屏): 藏来源行, 收紧留白, 保控件行完整 */
@media (max-height: 520px) {
  .fp-body { padding: 12px 24px; }
  .fp-source { display: none; }
  .fp-controls { margin-top: 8px; }
  .fp-transport { margin-top: 6px; }
  .fp-actions { margin-top: 10px; }
}

/* ---------- 队列视图 (占封面那块地方, 不再弹底部单) ---------- */
/* 点队列键: 封面原地翻开成播放队列 (照 Apple Music 待播放排版) —— 头部
   待播放 + 歌曲数 (左) 和 随机/循环 (右); 下面滚动列表: 当前曲 eq 动条,
   其余序号, 行右缘拖拽把手按住上下拖换顺序。 */
#fp-queue {
  position: absolute; inset: 0; z-index: 2;
  display: flex; flex-direction: column; overflow: hidden;
  /* 四边留白与大封面同款 (用户点名: 列表贴屏幕边太挤, 边距对齐封面) ——
     inset:0 是 .fp-body 的 padding 盒 (罩到边), 得自己再衬回来 */
  padding: 6px 24px 30px;
  -webkit-mask-image: linear-gradient(transparent, #000 10%, #000 94%, transparent);
  mask-image: linear-gradient(transparent, #000 10%, #000 94%, transparent);
}
.fq-head { display: flex; align-items: center; justify-content: space-between;
           padding: 6px 0 10px; }
.fq-head-txt b { display: block; font-size: 19px; font-weight: 700;
                 color: #fff; line-height: 1.25; }
.fq-head-txt small { font-size: 12px; color: rgba(255,255,255,.5); }
.fq-head-btns { display: flex; gap: 16px; }
.fq-head-btns button {
  display: flex; align-items: center; gap: 5px;
  font-size: 13px; font-weight: 600; color: rgba(255,255,255,.55);
}
.fq-head-btns button.on { color: #fff; }
#fp-repeat.one::after { content: "1"; font-size: 10px; font-weight: 700;
                        color: #fff; margin-left: 3px; }
#queue-list {
  flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 2px 0 14px;
}
.queue-row {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 0; text-align: left;
  border-bottom: 1px solid rgba(255,255,255,.09);
  transition: transform .18s ease; touch-action: pan-y;
}
.queue-row.dragging { position: relative; z-index: 3; transition: none;
  background: rgba(255,255,255,.08); box-shadow: 0 8px 22px rgba(0,0,0,.5);
  border-radius: 8px; border-bottom-color: transparent; }
.q-lead { width: 24px; flex-shrink: 0; display: flex; align-items: center;
          justify-content: center; color: rgba(255,255,255,.4); }
.q-num { font-size: 14px; font-style: normal;
         font-variant-numeric: tabular-nums; }
.queue-row.on .bars { display: inline-flex; }
.queue-row.on .q-title { color: #fff; font-weight: 600; }
.q-title { font-size: 15px; color: rgba(255,255,255,.85); flex-shrink: 1;
           overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.q-artist { font-size: 13px; color: rgba(255,255,255,.4);
            flex-shrink: 1; margin-left: auto; max-width: 42%;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.q-grip { flex-shrink: 0; width: 30px; height: 38px;
          display: flex; align-items: center; justify-content: center;
          color: rgba(255,255,255,.3); touch-action: none; }

/* ---------- 曲目长按菜单 ---------- */
.track-row, .dl-row, .pl-cover-btn {
  -webkit-touch-callout: none;        /* iOS 长按不弹放大镜/拷贝气泡 */
  -webkit-user-select: none; user-select: none;
}
.pl-cover-btn img { -webkit-user-drag: none; }   /* 长按封面别触发拖图 */
#track-menu-mask { position: fixed; inset: 0; z-index: 105; background: rgba(0,0,0,.4); }
#track-menu, #cover-menu {
  position: fixed; z-index: 106; min-width: 212px;
  max-width: min(320px, calc(100vw - 24px));   /* 长歌名不许把菜单撑超宽 (截断接管) */
  padding: 5px;
  background: rgba(44,44,46,.96);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--hairline); border-radius: 14px;
  box-shadow: 0 12px 32px rgba(0,0,0,.5);
}
#track-menu .menu-track, #cover-menu .menu-track {
  padding: 6px 12px 9px; margin-bottom: 4px;
  border-bottom: 1px solid var(--hairline);
}
#track-menu .menu-track b, #cover-menu .menu-track b {
  display: block; font-size: 14px; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis;
}
#track-menu .menu-track small, #cover-menu .menu-track small {
  display: block; font-size: 12px; color: var(--ink-2);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
#track-menu [data-track-action], #cover-menu [data-cover-action] {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 10px 12px; border-radius: 10px; font-size: 14px; text-align: left;
}
#track-menu [data-track-action]:active,
#cover-menu [data-cover-action]:active { background: var(--surface-3); }
#track-menu [data-track-action] svg, #cover-menu [data-cover-action] svg {
  flex-shrink: 0; color: var(--ink-2);
}

/* ---------- 添加到播放列表 (选择单) ---------- */
#picker-mask { position: fixed; inset: 0; z-index: 97; background: rgba(0,0,0,.5); }
#picker-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 98;
  max-height: 72vh; display: flex; flex-direction: column;
  background: rgba(28,28,30,.96);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-radius: 16px 16px 0 0; border: 1px solid var(--hairline);
}
.picker-track {
  padding: 4px 18px 10px; border-bottom: 1px solid var(--hairline);
  font-size: 12px; color: var(--ink-3);
}
.picker-track b {
  display: block; font-size: 15px; color: var(--ink-1);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
#picker-list { overflow-y: auto; padding: 4px 12px; min-height: 64px; }
.picker-row {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 11px 6px; text-align: left; border-bottom: 1px solid var(--hairline);
}
.picker-row .a-main { flex: 1; min-width: 0; }
.picker-row b { font-size: 14px; }
.picker-row small { display: block; font-size: 12px; color: var(--ink-2); }
.picker-new {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 18px calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--hairline);
}
.picker-new input {
  flex: 1; min-width: 0; background: var(--surface-2); border: 0;
  border-radius: 10px; padding: 9px 12px; color: var(--ink-1);
  font-size: 16px;   /* iOS 聚焦 <16px 会自动放大整页 */
}
.picker-new input::placeholder { color: var(--ink-3); }
#picker-create {
  color: var(--accent); font-weight: 600; font-size: 14px;
  padding: 6px; flex-shrink: 0;
}

/* ---------- 提示 ---------- */
#toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(8px); z-index: 120;
  max-width: 82vw; padding: 9px 18px; border-radius: 999px;
  background: rgba(58,58,60,.95); color: var(--ink-1); font-size: 13px;
  text-align: center; opacity: 0; transition: opacity .25s, transform .25s;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (min-width: 700px) {
  #root-view { padding-left: 28px; padding-right: 28px; }
  .album-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
}
</style>
</head>
