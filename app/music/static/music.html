<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

        env(safe-area-inset-top) 要拿真实值 (black 会让独立模式报 0)。

<link rel="manifest" href="/music/static/manifest.json">
<title>My Music</title>

<!-- 固定壳: 文档不滚, main 是唯一一级滚动器; 底部船坞 (fixed bottom) 和
     推入层 (z44) 从它底下扫过 -->

<div id="root-view"><div class="list-empty">加载中…</div></div>
</main>
